<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>運命のドラフト会議</title>

<style>
:root{
  --paper:#f6efdb; --paper2:#efe5c9; --ink:#1a1a22; --navy:#12264a; --navy2:#0c1a33;
  --red:#a4161a; --gold:#b8860b; --line:#c9bc96; --card:#fffaf0; --sub:#5a5340;
  --bg:#e7dfc8; --good:#1e6b34; --bad:#a4161a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1220; --paper:#efe7cf; --paper2:#e6dbba; --card:#f8f2de; --ink:#1a1a22; --sub:#5a5340; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif; font-size:15px; line-height:1.65;}
#app{max-width:680px; margin:0 auto; padding:14px 12px 60px;}
h1,h2,h3,.mincho{font-family:"Shippori Mincho B1",serif;}
button{font-family:inherit; cursor:pointer;}
.btn{display:block; width:100%; padding:14px 16px; margin:10px 0; border:2px solid var(--navy); background:var(--navy); color:#f6efdb; font-size:16px; font-weight:700; border-radius:6px; text-align:center;}
.btn:active{transform:translateY(1px);}
.btn.sub{background:var(--card); color:var(--navy);}
.btn.ghost{background:transparent; color:var(--navy); border-color:var(--line);}
.btn.red{background:var(--red); border-color:var(--red);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.small{padding:9px 12px; font-size:14px; margin:6px 0;}
.choice{display:block; width:100%; text-align:left; padding:13px 14px; margin:9px 0; background:var(--card); border:1.5px solid var(--line); border-radius:8px; color:var(--ink);}
.choice b{font-size:15.5px; display:block; margin-bottom:2px;}
.choice span{font-size:13px; color:var(--sub); display:block;}
.choice:active{border-color:var(--navy); background:#fff;}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:14px; margin:12px 0;}
.paper{background:var(--paper); border:1.5px solid var(--line); border-radius:4px; padding:16px 14px; margin:12px 0; box-shadow:0 2px 8px rgba(20,20,40,.12);}
.kicker{font-size:11.5px; letter-spacing:.22em; color:var(--red); font-weight:900; text-transform:none;}
.title-big{font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:34px; line-height:1.25; margin:6px 0 4px; color:var(--navy2);}
.lead{font-size:14.5px; color:#33302a;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0;}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px 10px;}
.stat .lb{font-size:11px; color:var(--sub); font-weight:700; letter-spacing:.08em;}
.stat .vl{font-size:20px; font-weight:900; font-family:"Shippori Mincho B1",serif;}
.bar{height:8px; background:#ddd2ae; border-radius:4px; overflow:hidden; margin-top:4px;}
.bar i{display:block; height:100%; background:var(--navy);}
.bar i.hot{background:var(--red);}
.log{background:var(--navy2); color:#e9e2c8; border-radius:8px; padding:12px 14px; font-size:13.5px; margin:12px 0; max-height:300px; overflow-y:auto;}
.log div{padding:3px 0; border-bottom:1px dashed rgba(233,226,200,.18);}
.log div:last-child{border-bottom:none;}
.log .hl{color:#ffd76a; font-weight:700;}
.log .me{color:#8fd0ff; font-weight:700;}
.month-head{display:flex; align-items:baseline; gap:10px; border-bottom:3px double var(--navy); padding-bottom:6px; margin-bottom:8px;}
.month-head .m{font-family:"Shippori Mincho B1",serif; font-size:26px; font-weight:800; color:var(--navy2);}
.month-head .y{font-size:12.5px; color:var(--sub); font-weight:700;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:6px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
th{font-size:11.5px; color:var(--sub); letter-spacing:.05em;}
.tag{display:inline-block; font-size:11px; font-weight:700; background:var(--navy); color:#f6efdb; border-radius:3px; padding:1px 6px; margin:1px 2px 1px 0;}
.tag.red{background:var(--red);} .tag.gold{background:var(--gold);} .tag.gray{background:#6b6455;}
.chip{display:inline-block; font-size:11.5px; border:1px solid var(--line); background:var(--paper); border-radius:20px; padding:2px 9px; margin:2px 3px 2px 0; font-weight:700;}
.rowitem{display:flex; gap:8px; align-items:flex-start; padding:9px 8px; border-bottom:1px solid var(--line);}
.rowitem .grow{flex:1; min-width:0;}
.rowitem .nm{font-weight:900; font-size:14.5px;}
.rowitem .meta{font-size:12px; color:var(--sub);}
.pickdetail{padding:10px 8px; border-bottom:1px solid var(--line);}
.dbox{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:6px 0; font-size:12.5px;}
.dbox-t{font-size:11px; font-weight:900; letter-spacing:.1em; color:var(--red); margin-bottom:2px;}
.stattbl{font-size:12px; margin:2px 0 6px;}
.stattbl th,.stattbl td{text-align:center; padding:4px 3px;}
.tl{margin:6px 0 2px 4px; border-left:2px solid var(--line);}
.tl-item{position:relative; padding:0 0 9px 14px;}
.tl-item:before{content:''; position:absolute; left:-5px; top:6px; width:8px; height:8px; border-radius:50%; background:var(--navy);}
.tl-item:last-child{padding-bottom:1px;}
.tl-head{font-size:13px; font-weight:700;}
.tl-sub{font-size:12px; color:var(--sub);}
.mini{font-size:12px; padding:7px 10px; border-radius:5px; border:1.5px solid var(--navy); background:var(--card); color:var(--navy); font-weight:700; white-space:nowrap;}
.mini.on{background:var(--navy); color:#f6efdb;}
.mini.red{border-color:var(--red); color:var(--red);}
select,input[type=text]{font-family:inherit; font-size:14px; padding:8px; border:1.5px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); width:100%;}
.flex{display:flex; gap:8px;} .flex>*{flex:1;}
.notice{border-left:5px solid var(--red); background:#fdf3e3; padding:10px 12px; margin:10px 0; font-size:13.5px; border-radius:0 6px 6px 0;}
.goodbox{border-left:5px solid var(--good); background:#eef7ee; padding:10px 12px; margin:10px 0; font-size:13.5px; border-radius:0 6px 6px 0;}
.mininews{border:1px solid var(--line); border-top:3px double var(--navy); background:var(--card); padding:8px 11px; margin:6px 0;}
.mininews .mn-kicker{font-size:10.5px; letter-spacing:.14em; color:var(--sub);}
.mininews .mn-head{font-family:"Shippori Mincho B1",serif; font-weight:700; font-size:14.5px; margin:2px 0;}
.mininews .mn-body{font-size:12.5px; line-height:1.55;}
.rankbig{font-family:"Shippori Mincho B1",serif; font-size:74px; font-weight:800; line-height:1; color:var(--red); text-align:center;}
.small{font-size:12.5px; color:var(--sub);}
.center{text-align:center;}
/* 新聞一面オーバーレイ */
#newsOverlay{position:fixed; inset:0; background:rgba(8,10,18,.78); z-index:60; display:none; overflow-y:auto; padding:18px 10px 40px;}
#newsOverlay.open{display:block;}
.newspaper{max-width:620px; margin:0 auto; background:var(--paper); color:#191922; border:2px solid #191922; padding:18px 16px 20px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
.np-mast{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:4px double #191922; padding-bottom:6px;}
.np-name{font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:27px; letter-spacing:.14em;}
.np-date{font-size:11px; text-align:right; color:#444;}
.np-head{font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:31px; line-height:1.3; margin:14px 0 6px; text-align:center;}
.np-sub{font-family:"Shippori Mincho B1",serif; font-size:16.5px; font-weight:700; text-align:center; margin:0 0 10px; color:#333;}
.np-body{font-size:13.5px; line-height:1.85; border-top:1px solid #191922; padding-top:10px; text-align:justify;}
.np-photo{background:#d8cda6; border:1px solid #8a7d55; padding:22px 10px; text-align:center; font-family:"Shippori Mincho B1",serif; font-weight:700; color:#4c4326; margin:10px 0; font-size:14px;}
.np-side{border:1px solid #191922; padding:8px 10px; font-size:12px; margin-top:10px; background:var(--paper2);}
.modal{position:fixed; inset:0; background:rgba(8,10,18,.7); z-index:50; display:none; overflow-y:auto; padding:16px 10px 40px;}
.modal.open{display:block;}
.modal .sheet{max-width:620px; margin:0 auto; background:var(--paper); border:1.5px solid var(--line); border-radius:8px; padding:16px 14px;}
.stickybar{position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5;}
.pickfeed div{animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .pickfeed div{animation:none;} }
.teamgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.teamgrid button{padding:12px 8px; border:1.5px solid var(--line); background:var(--card); border-radius:8px; font-weight:900; font-size:14.5px; color:var(--ink); text-align:left;}
.teamgrid button small{display:block; font-weight:500; font-size:11.5px; color:var(--sub);}
.teamgrid button:active{border-color:var(--navy);}
</style>
</head>
<body>
<div id="app"></div>

<div id="newsOverlay">
  <div class="newspaper" id="newsPaper"></div>
  <div style="max-width:620px;margin:12px auto 0;">
    <button class="btn" id="newsClose">記事を閉じる</button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>

<script>
"use strict";
/* ============ ユーティリティ ============ */
var $app = document.getElementById('app');
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function rf(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function scrollTop(){ window.scrollTo({top:0}); }
function setView(html){ $app.innerHTML = html; scrollTop(); }

/* ============ 球団データ（実在12球団） ============ */
var TEAMS = [
 {name:'阪神タイガース', short:'阪神', league:'セ', home:'甲子園'},
 {name:'読売ジャイアンツ', short:'巨人', league:'セ', home:'東京ドーム'},
 {name:'横浜DeNAベイスターズ', short:'DeNA', league:'セ', home:'横浜スタジアム'},
 {name:'広島東洋カープ', short:'広島', league:'セ', home:'マツダスタジアム'},
 {name:'東京ヤクルトスワローズ', short:'ヤクルト', league:'セ', home:'神宮球場'},
 {name:'中日ドラゴンズ', short:'中日', league:'セ', home:'バンテリンドーム'},
 {name:'福岡ソフトバンクホークス', short:'ソフトバンク', league:'パ', home:'みずほPayPayドーム'},
 {name:'北海道日本ハムファイターズ', short:'日本ハム', league:'パ', home:'エスコンフィールド'},
 {name:'東北楽天ゴールデンイーグルス', short:'楽天', league:'パ', home:'楽天モバイルパーク'},
 {name:'埼玉西武ライオンズ', short:'西武', league:'パ', home:'ベルーナドーム'},
 {name:'千葉ロッテマリーンズ', short:'ロッテ', league:'パ', home:'ZOZOマリン'},
 {name:'オリックス・バファローズ', short:'オリックス', league:'パ', home:'京セラドーム'}
];
/* ウェイバー順（前年下位から） */
var WAIVER = [5,10,4,9,3,11,2,8,1,7,0,6];

/* ============ 名前・学校などの素材（全て架空の人名生成用） ============ */
var SURNAMES = ['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','斎藤','清水','山崎','森','池田','橋本','阿部','石川','山下','中山','藤田','後藤','岡田','前田','長谷川','村上','近藤','石井','坂本','遠藤','青木','藤井','西村','福田','太田','三浦','岡本','松田','中島','中野','原田','小野','田村','竹内','金子','和田','石田','上田','森田','柴田','酒井','工藤','横山','宮崎','宮本','内田','高木','安藤','谷口','大野','丸山','今井','藤原','高田','本田','澤田','武田','中西','小松','川村','杉山','浜田','市川','野口','菊地','野村','新井','渡部','岩崎','木下','久保','佐野','野田','松井','増田','千葉','菅原','木田','長田','小山','平野','谷','塚本','星野','辻','南','西田','東','片山','川口','水野','吉川','山根','浅野','安田','大西','栗原','細川','金田','早川','奈良','桑原','江口','岡','須田','荒木','土屋','大石','佐久間','大谷','松浦','井口','豊田','河野','堀','猪俣','鷲見','鵜飼','鰐淵','梶原','鮫島','鶴田','亀井','龍野','鳳','麓','塙','埴原'];
var GIVEN = ['翔太','大輝','健太','悠斗','蓮','颯太','陽翔','樹','陸','湊','悠真','大和','翼','海斗','智也','直樹','雄大','達也','慎之介','拓海','颯','駿','光希','龍之介','敬斗','歩夢','晴斗','蒼','岳','源太','武蔵','虎太郎','獅子丸','鉄平','剛','豪','力','猛','忍','要','司','徹','淳','聡','圭','亮','圭吾','玲於','瑛太','壮真','一真','昊','朔','凪','漣','旭','暁','暉','凱','嶺','巌','岳人','颯真','悠人','大翔','陽太','悠希','悠生','悠翔','佳祐','圭佑','啓太','敬太','健太郎','康太','航太','孝太','浩太','翔太朗','颯太朗','大雅','泰雅','晴雅','涼','涼太','涼介','涼真','湊太','湊斗','奏太','創太','蒼太','蒼真','蒼介'];
var HS_SCHOOLS = ['大阪桐蔭','履正社','横浜','東海大相模','花巻東','仙台育英','作新学院','広陵','智弁和歌山','明徳義塾','健大高崎','青森山田','星稜','沖縄尚学','日本文理','帝京','早稲田実業','慶應義塾','中京大中京','愛工大名電','天理','報徳学園','敦賀気比','九州国際大付','鹿児島実業'];
/* 選手編の主人公専用：中堅校・弱小校プール（いずれも架空の学校名。実在校を「弱小」とは呼ばない）。
   スカウト編の候補者生成は従来どおり実在の強豪プール（HS_SCHOOLS）だけを使う */
var HS_MID_DEFS = [['東雲学園','東京都'],['青葉学園','神奈川県'],['北辰学園','北海道'],['翠明学園','愛知県'],['城星学園','大阪府'],['陽明台学園','福岡県'],['双葉学園','宮城県'],['錦ヶ丘学園','石川県'],['清流台学園','静岡県'],['若松原学園','広島県'],['天領学園','大分県'],['高原学園','長野県'],['望洋学園','千葉県'],['白雲学園','熊本県']];
var HS_WEAK_DEFS = [['汐見ヶ丘高校','千葉県'],['麦秋台高校','群馬県'],['千曲南高校','長野県'],['最上西高校','山形県'],['浜通り南高校','福島県'],['越後丘陵高校','新潟県'],['若狭湾高校','福井県'],['土佐西南高校','高知県'],['豊前海高校','大分県'],['阿蘇外輪高校','熊本県'],['薩摩南高校','鹿児島県'],['宍道湖南高校','島根県']];
var HS_MID_SCHOOLS = HS_MID_DEFS.map(function(d){ return d[0]; });
var HS_WEAK_SCHOOLS = HS_WEAK_DEFS.map(function(d){ return d[0]; });
/* 主人公の高校の格付け抽選：強豪は少数派、中堅が厚く、弱小もしっかり出る配分 */
function pickPlayerSchool(){
  var r = Math.random();
  if(r < 0.20) return {org: pick(HS_SCHOOLS), tier:'ace'};
  if(r < 0.65) return {org: pick(HS_MID_SCHOOLS), tier:'mid'};
  return {org: pick(HS_WEAK_SCHOOLS), tier:'weak'};
}
function schoolTierOf(org){
  if(HS_MID_SCHOOLS.indexOf(org)>=0) return 'mid';
  if(HS_WEAK_SCHOOLS.indexOf(org)>=0) return 'weak';
  if(HS_SCHOOLS.indexOf(org)>=0) return 'ace';
  return null;
}
function schoolTierLabel(tier){ return tier==='ace' ? '強豪校' : tier==='mid' ? '中堅校' : tier==='weak' ? '弱小校' : ''; }
/* 学校の格が持つ数値：注目度バイアス（メディア評価の出方）と、大会でのチーム力補正。
   弱小校は注目されにくい（マイナス）が、チーム力補正は個人の実力で覆せる幅に留め、
   甲子園・注目の下剋上ルートは残す */
function schoolMediaBias(tier){ return tier==='ace' ? 3 : tier==='mid' ? 0 : tier==='weak' ? -3 : 0; }
function schoolTeamAdj(tier){ return tier==='ace' ? 4 : tier==='weak' ? -5 : 0; }
function schoolPrestigeOf(tier){ return tier==='ace' ? 5 : tier==='mid' ? 1 : -2; }
/* 架空の中堅・弱小校ごとの「甲子園出場歴」：学校名から決定的に生成する（同じ学校なら何度引いても同じ歴史になる）。
   弱小校は「出場ゼロ（創部初を狙う）」と「数十年ぶりに1〜2回」が厚く、中堅校は復活までの間隔が短め。
   実在の強豪校には付けない（下剋上報道の対象外） */
function schoolKoshienHistory(org){
  var tier = schoolTierOf(org);
  if(tier!=='weak' && tier!=='mid') return null;
  var h = 2166136261;
  for(var i=0;i<org.length;i++){ h ^= org.charCodeAt(i); h = Math.imul(h, 16777619); }
  var seed = h>>>0;
  function rnd(){ seed = (Math.imul(seed, 1664525) + 1013904223)>>>0; return seed/4294967296; }
  function rr(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
  var count, years = null;
  var clubYears = rr(18, 64);
  var r = rnd();
  if(tier==='weak'){
    if(r<0.52) count = 0;
    else if(r<0.80){ count = 1; years = rr(34, 68); }
    else if(r<0.93){ count = 2; years = rr(25, 52); }
    else { count = 1; years = rr(19, 33); }
  } else {
    if(r<0.28) count = 0;
    else if(r<0.58){ count = 1; years = rr(13, 38); }
    else if(r<0.83){ count = 2; years = rr(9, 28); }
    else { count = 3; years = rr(5, 17); }
  }
  return {count:count, yearsSince:years, clubYears:clubYears};
}
function playerSchoolHistory(){
  if(typeof P==='undefined' || !P || !P.school) return null;
  if(P.schoolHistory===undefined) P.schoolHistory = schoolKoshienHistory(P.school);
  return P.schoolHistory;
}
/* 出場歴の言い回し：ゼロなら「創部初」、復活なら「○年ぶり○回目」（今回の出場を含めた回数） */
function koshienHistPhrase(hist){
  if(!hist) return '';
  if(hist.count===0) return '創部初の甲子園出場';
  return hist.yearsSince+'年ぶり'+(hist.count+1)+'回目の甲子園出場';

/* ============ 経歴ステージ（球歴チェーン）とステージ別成績・タイトル ============ */
function tierOf(p){ return p>=78 ? 'hi' : (p>=58 ? 'mid' : 'low'); }
function rf2(a,b){ return (Math.round(rf(a,b)*100)/100).toFixed(2); }
function stageObj(name, note, ach, memo){ return {name:name, note:note, ach:(ach&&ach.text)||'', nat:!!(ach&&ach.nat), title:!!(ach&&ach.title), memo:memo||''}; }
function careerChainText(stages){ return (stages||[]).map(function(s){ return s.name+'（'+s.note+'）'; }).join(' → '); }
function stageLinesHtml(c){
  if(!c.stages || !c.stages.length) return '';
  var lines = c.stages.map(function(s){
    /* 実績文がまだ無いステージ（選手編の進行中シーズンなど）は所属名だけを出す。
       成績が確定した実績文は、シーズン終了時に attachStageSeason 等が実際の結果から付ける */
    var tail = s.ach || '';
    if(s.memo) tail += (tail ? '。' : '') + s.memo;
    return esc(s.name) + (tail ? '：' + esc(tail) : '');
  });
  return '<br><span class="small">'+lines.join('<br>')+'</span>';
}

function hsStage(org, pos, p){ return stageObj(org, HS_PREF[org]||'高校野球', achHS(pos, p), stageCareer('hs', p)); }

function mlbStage(org, pos, p){ var par = mlbParentOf(org); return stageObj(org, minorLeagueText(org), achMinor(pos, p, '3A'), par ? '親球団は'+par+'。傘下3Aが主戦場で、メジャー昇格を目指す' : 'MLB傘下3Aが主戦場で、メジャー昇格を目指す'); }
function buildStages(cat, org, pos, pot, extra){
  extra = extra || {};
  var stages = [];
  function sp(){ return clamp(pot + ri(-7,7), 30, 99); }
  if(cat==='odd' && extra.subType==='softball'){
    stages.push(stageObj(pick(JH_PLACES)+pick(JH_SUFFIX)+'ソフトボール部', '中学ソフトボール', achSBMiddle(sp()), '中学からソフトボール一筋。硬式野球の経験はない'));
    stages.push(stageObj(pick(JH_PLACES)+pick(['第一高校','東高校','西高校','中央高校','商業高校'])+'ソフトボール部', '高校総体', achSBHS(pos, sp()), pick(['高校でもソフトボールの主軸を担った','総体・国体の舞台で全国のレベルを知った'])));
    if(Math.random()<0.55) stages.push(stageObj(pick(UNIVS)+'ソフトボール部', '大学ソフトボール', achSBUni(pos, sp()), '大学でもソフトボール部で主軸を担った'));
    stages.push(stageObj(org, '日本男子ソフトボールリーグ', achSBLeague(pos, sp()), pick(['日本リーグで主軸を担う','社会人硬式の練習参加や入団テストで打力をアピールした'])));
    return stages;
  }
  if(cat==='odd' && extra.subType==='rubberball'){
    stages.push(rubberMiddleStage());
    stages.push(hsStage(pick(HS_SCHOOLS), pos, sp()));
    stages.push(stageObj(org, '軟式・天皇賜杯全日本軟式野球大会', achRubberFinal(pos, sp(), extra.tenno||'出場'), pick(['軟式の最高峰・天皇賜杯で結果を残した','硬式球への適応の早さが注目されている'])));
    return stages;
  }
  if(cat==='overseas' && extra.subType==='usMlb'){
    /* 米国育ちの逆輸入：アメリカの高校 → MLBドラフト → 2A → 3A（→ MLBデビュー）→ NPBドラフト、という経歴チェーン。
       日本の全国制覇に相当するフラグ（nat）は一切立てない（最上位バンドのゲートは米国の実績では代替できない） */
    stages.push(stageObj(extra.usHS||'アメリカの高校', 'アメリカの高校野球', achUSHS(pos, sp()), '米国で生まれ育ち、高校までアメリカでプレーした'));
    stages.push(stageObj(extra.mlbTeam, 'MLBドラフト', {text:'MLBドラフト'+extra.draftRound+'巡目（全体'+extra.draftOverall+'位）で'+extra.mlbTeam+'から指名を受け、契約'}, '高校卒業と同時にプロ入り。日本のドラフトにはかかっていない'));
    stages.push(stageObj(extra.aaTeam, minorLeagueText(extra.aaTeam), achMinor(pos, sp(), '2A'), 'マイナーのバス移動と地方球場の日々から這い上がった'));
    stages.push(stageObj(extra.aaaTeam, minorLeagueText(extra.aaaTeam), achMinor(pos, sp(), '3A'), extra.usType==='debut' ? 'メジャー昇格と3A降格を行き来した' : 'メジャー昇格まであと一歩のところで足踏みが続いた'));
    if(extra.usType==='debut') stages.push(stageObj(extra.mlbTeam, 'MLB（メジャーリーグ）', achMLBDebut(pos, sp()), 'メジャーデビューの夢は叶えた。だが定着はできなかった'));
    return stages;
  }
  stages.push(middleStage());
  var hsOrg = (cat==='hs') ? org : pick(HS_SCHOOLS);
  stages.push(hsStage(hsOrg, pos, sp()));
  if(cat==='hs') return stages;
  if(cat==='uni'){ stages.push(uniStage(org, pos, sp())); return stages; }
  if(cat==='company'){
    if(Math.random()<0.6) stages.push(uniStage(pick(UNIVS), pos, sp()));
    stages.push(companyStage(org, pos, sp()));
    return stages;
  }
  if(cat==='ind'){
    if(Math.random()<0.35) stages.push(uniStage(pick(UNIVS), pos, sp()));
    if(Math.random()<0.35){ var others = IND_TEAMS.filter(function(t){ return t!==org; }); stages.push(indStage(pick(others), pos, sp())); }

  if(c.cat==='ind') return [{name:'前期リーグ', w:0.48},{name:'後期リーグ', w:0.52}];
  if(c.cat==='overseas') return [{name:'前半戦', w:0.48},{name:'後半戦（プレーオフ含む）', w:0.52}];
  if(c.subType==='softball') return [{name:'日本リーグ前期', w:0.48},{name:'日本リーグ後期', w:0.52}];
  return [{name:'地区大会', w:0.55},{name:'天皇賜杯', w:0.45}];
}
function splitCounts(total, weights){
  var raw = weights.map(function(w){ return total*w; });
  var base = raw.map(function(v){ return Math.floor(v); });
  var rem = total - base.reduce(function(a,b){ return a+b; }, 0);
  var order = raw.map(function(v,i){ return {i:i, f:v-Math.floor(v)}; }).sort(function(a,b){ return b.f-a.f; });
  for(var k=0;k<rem;k++){ base[order[k%order.length].i]++; }
  return base;
}
function stageRowsForStats(c, st, isPitch, salt){
  if(!st) return [];
  var defs = stageDefsFor(c);
  var tw = defs.reduce(function(a,d){ return a+d.w; }, 0);
  var ws = defs.map(function(d){ return d.w/tw; });
  var rnd = srand(c.id*7919+17+salt);
  var gs = splitCounts(st.gp, ws);
  if(isPitch){
    var wA = splitCounts(st.w, ws), lA = splitCounts(st.l, ws), soA = splitCounts(st.so, ws);
    return defs.map(function(d,i){ var w = wA[i], l = lA[i]; if(w+l>gs[i]) l = Math.max(0, gs[i]-w); return {name:d.name, g:gs[i], era: clamp(st.era + (rnd()-0.5)*0.9, 0.5, 7.5), w:w, l:l, so:soA[i]}; });
  }
  var hrA = splitCounts(st.hr, ws), rbiA = splitCounts(st.rbi, ws), sbA = splitCounts(st.sb, ws);
  return defs.map(function(d,i){ return {name:d.name, g:gs[i], avg: clamp(st.avg + (rnd()-0.5)*0.05, 0.150, 0.420), hr:hrA[i], rbi:rbiA[i], sb:sbA[i]}; });
}
function stageStatsFor(c){
  if(!c.stats) return [];
  var key = JSON.stringify(c.stats)+'/'+JSON.stringify(c.statsB||null);
  if(c._ssKey===key && c._ssRows) return c._ssRows;
  var rows = stageRowsForStats(c, c.stats, c.pos==='投手', 0);
  c._ssKey = key; c._ssRows = rows;
  return rows;
}

function updateScoutStats(){

var candSeq = 1;
function makeCandidate(cat, forceUS){
  var pos = pick(POSITIONS);
  /* 真の将来性：分布を作る */
  var r = Math.random(), pot;
  if(r<0.05) pot = ri(88,97);
  else if(r<0.20) pot = ri(78,87);
  else if(r<0.50) pot = ri(66,77);
  else if(r<0.80) pot = ri(54,65);
  else pot = ri(38,53);
  var org, age, subType = null, tenno = null;
  var usType = null, mlbTeam = null, aaaTeam = null, aaTeam = null, usHS = null, usDraftRound = null, usDraftOverall = null;
  if(cat==='hs'){ org = pick(HS_SCHOOLS); age = 18; }
  else if(cat==='uni'){ org = pick(UNIVS); age = ri(21,22); }
  else if(cat==='company'){ org = pick(COMPANIES); age = ri(20,28); }
  else if(cat==='ind'){ org = pick(IND_TEAMS); age = ri(19,27); }
  else if(cat==='overseas' && forceUS){
    /* 米国育ちの逆輸入（MLBドラフト経由）：現在の所属は傘下3A球団。野手中心の型 */
    subType = 'usMlb';
    usType = Math.random()<0.45 ? 'debut' : 'minor';
    var mo = pick(MLB_ORGS); mlbTeam = mo.mlb; aaaTeam = mo.aaa; aaTeam = mo.aa;
    org = aaaTeam; age = ri(25,30);
    usHS = pick(US_HS_CITIES)+'の高校';
    usDraftRound = ri(2,9); usDraftOverall = (usDraftRound-1)*30 + ri(3,29);
    if(Math.random()<0.55) pos = pick(['内野手','内野手','外野手','捕手']);
  }
  else if(cat==='overseas'){ org = pickOverseasOrg(); age = ri(22,29); }
  else {
    /* 異色経歴：ソフトボール出身／軟式野球出身の2サブタイプ（おおむね半々、所属は実在チーム） */
    subType = Math.random()<0.5 ? 'softball' : 'rubberball';
    if(subType==='softball'){
      org = pick(SB_TEAMS); age = ri(19,26);
      pos = pick(['外野手','外野手','内野手','内野手','捕手','投手']); /* 野手中心 */
    } else {
      org = pick(RB_TEAMS); age = ri(19,27);
      tenno = pickTenno();
    }
  }
  var tags = [];
  if(pos==='投手'){ tags.push(pick(PITCH_TAGS)); if(Math.random()<0.4) tags.push(pick(PITCH_TAGS)); }
  else { tags.push(pick(BAT_TAGS)); if(Math.random()<0.45) tags.push(pick(BAT_TAGS)); if(pos==='捕手'&&Math.random()<0.5) tags.push('強肩'); }
  if(subType==='softball' && pos!=='投手' && Math.random()<0.55 && tags.indexOf('長打力')<0) tags.push('長打力');
  var twoWay = false;
  if(pos==='投手' && Math.random()<0.025){ twoWay = true; tags.push('二刀流'); pot = clamp(pot+4,0,98); }
  /* 意向（隠し）。条件付きの意向を持つ選手自体を絞り、特に「MLB一本」「他球団一筋」は少数派にする */
  var intent = null;
  var ir = Math.random();
  if(ir<0.12) intent = {type:'rank', n: pick([2,2,3,3,4])};
  else if(ir<0.20 && (cat==='hs'||cat==='uni')) intent = {type:'study'};
  else if(ir<0.23) intent = {type:'mlb'};
  else if(ir<0.27){ var lt = ri(0,11); intent = {type:'local', team:lt}; }
  var __nc = {
    id: candSeq++, name: genName(), age: age, cat: cat, org: org, pos: pos, bt: genBT(pos),
    tags: tags.filter(function(t,i,a){return a.indexOf(t)===i;}), twoWay: twoWay,
    pot: pot, media: 60, subType: subType, tenno: tenno,
    usType: usType, mlbTeam: mlbTeam, aaaTeam: aaaTeam, aaTeam: aaTeam, usHS: usHS, draftRound: usDraftRound, draftOverall: usDraftOverall,
    estMid: 60, unc: ri(12,16),
    intent: intent, intentKnown:false, intentHint:false, visitCount:0, comment:'', fav:false,
    scouted:0, rivalHint:false, takenBy:-1,
    mediaBias:0, mediaNoise:0, mediaEvent:0, mediaCap:null, natTitle:false, stages:null
  };
  attachPerson(__nc);
  /* 世間の評価（メディア）＝ pot ＋ 所属の格バイアス ＋ 実績ブースト ＋ フィジカルバイアス ＋ ノイズ（序盤はブレ大） */
  __nc.mediaBias = orgPrestigeBias(__nc) + physBias(__nc) + achBoost(__nc);
  __nc.mediaNoise = cat==='hs' ? ri(-11,11) : ri(-9,9);
  refreshMedia(__nc);
  __nc.estMid = clamp(__nc.media + ri(-6,6), 25, 99);
  return __nc;
}
var CAT_LABEL = {hs:'高校', uni:'大学', company:'社会人', ind:'独立', overseas:'海外・逆輸入', odd:'異色経歴'};
function generatePool(){
  candSeq = 1;
  var pool = [];
  var plan = [['hs',40],['uni',25],['company',20],['ind',8],['overseas',6],['odd',6]];
  /* 米国育ちの逆輸入は「たまに現れる」レア枠：約30%の回だけ、海外6枠のうち1枠だけがこの型になる（0〜1人／回を構造で担保） */
  var usSlot = Math.random()<0.30 ? ri(0,5) : -1;
  plan.forEach(function(p){
    for(var i=0;i<p[1];i++) pool.push(makeCandidate(p[0], p[0]==='overseas' && i===usSlot));
  });
  applyCategoryCaps(pool);
  return pool;
}
/* カテゴリ上限（最終クランプ）：異色経歴は予想順位25位より上に行かず、海外・逆輸入は15位より上に行かない。
   プール内の media 順位で機械的に担保し、上限値は mediaCap として保持して月次更新でも効かせる */
function applyCategoryCaps(pool){
  /* 基準はクランプ対象外（通常区分）の候補の media 分布。これにより、対象同士が密集しても順位の下限が崩れない */
  var base = pool.filter(function(c){ return c.cat!=='odd' && c.cat!=='overseas'; }).map(function(c){ return c.media; }).sort(function(a,b){ return b-a; });
  pool.forEach(function(c){
    if(c.cat==='odd'){
      c.mediaCap = Math.min(79, base.length>24 ? base[24]-1 : 55);
      if(c.media > c.mediaCap) c.media = c.mediaCap;
      c.estMid = Math.min(c.estMid, c.media + 8);
    } else if(c.cat==='overseas' && c.subType==='usMlb'){
      /* 米国育ちの逆輸入専用の天井：通常の逆輸入（15位）より少し上だが、20位前後まで。最上位バンドには入らない
         （加えて refreshMedia の「全国制覇なしは79止まり」が二重に効く。米国の実績では代替できない） */
      c.mediaCap = (base.length>18 ? base[18]-1 : 60);
      if(c.media > c.mediaCap) c.media = c.mediaCap;
      c.estMid = Math.min(c.estMid, c.media + 8);
    } else if(c.cat==='overseas'){
      c.mediaCap = (base.length>13 ? base[13]-1 : 65);
      if(c.media > c.mediaCap) c.media = c.mediaCap;
      c.estMid = Math.min(c.estMid, c.media + 8);
    }
  });
}
function intentText(c){
  if(!c.intent) return '特に条件なし（どの球団・順位でも入団見込み）';
  if(c.intent.type==='rank') return c.intent.n+'位以内で指名されなければ入団しない意向';
  if(c.intent.type==='study') return '進学希望が強い（指名順位と条件次第では進学を選ぶ）';
  if(c.intent.type==='mlb') return 'MLB志望（NPB指名でも渡米を選ぶ可能性）';
  if(c.intent.type==='local') return '地元球団（'+TEAMS[c.intent.team].short+'）への入団を強く希望';
  return '';
}

function saveArchive(rec){ try{ var a = loadArchive(); a.unshift(rec); a = a.slice(0,30); localStorage.setItem(ARCH_KEY, JSON.stringify(a)); }catch(e){} clearProgressSave(); }

/* ============ 進行中セーブ（localStorage／アーカイブとは別領域） ============
   節目（フェイズ遷移・月送り・画面遷移）ごとに saveProgress が呼ばれ、
   主人公 P／スカウト状態 S／会議状態 D／選手編会議 PD と候補者プール全体を
   そのまま保存する。復元時は保存時点の画面（screen.kind）から再描画する。
   関数を含む一時オブジェクト（月の出来事の選択肢など）は、生成元の
   インデックス（_idx）から作り直すことで、状態の不整合を出さない */
var PROG_KEY = 'unmeiDraftProgress_v1';
var _bypassNew = false;
var _pendingNew = null;
function progLoad(){ try{ var s = localStorage.getItem(PROG_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function hasProgress(){ return !!progLoad(); }
function clearProgressSave(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
function fnDropReplacer(k, v){ return typeof v === 'function' ? undefined : v; }
function clonePlain(o){ if(o == null) return o; return JSON.parse(JSON.stringify(o, fnDropReplacer)); }
function progressLabel(mode, kind){
  if(mode === 'player'){
    var who = (typeof P !== 'undefined' && P && P.name) ? '（' + P.name + '）' : '';
    switch(kind){
      case 'introNews': return '選手編' + who + ' ― 高校3年・開幕';
      case 'playerFlow': case 'playerFlowResult': { var hi = (typeof HS_MONTHS !== 'undefined' && HS_MONTHS[P.monthIdx]) || {}; return '選手編' + who + ' ― 高校3年・' + (hi.m || '') + '（' + (hi.name || '') + '）'; }
      case 'playerOctober': case 'playerOctVisitResult': case 'playerMlbOffer': case 'playerSubmitChoice': return '選手編' + who + ' ― 高校3年・10月（運命の月）';
      case 'playerPathChoice': return '選手編' + who + ' ― ' + P.age + '歳・進路選択';
      case 'playerOffers': return '選手編' + who + ' ― ' + P.age + '歳・所属オファー選択';
      case 'playerTransfer': case 'playerTransferDone': return '選手編' + who + ' ― ' + P.age + '歳・転進の選択';
      case 'playerPathYear': case 'playerPathEvent': case 'playerPathYearEnd': { var lb = {uni:'大学', company:'社会人', ind:'独立リーグ', overseas:'海外', mlb:'MLBマイナー', mlbM:'MLB（メジャー）'}[P.curPath] || ''; return '選手編' + who + ' ― ' + lb + (P.pathYear || 1) + '年目・' + P.age + '歳'; }
      case 'playerDraftStart': case 'playerDraftReveal': return '選手編' + who + ' ― ドラフト会議当日';
      case 'playerDeclineNews': return '選手編' + who + ' ― 入団拒否の報道';
    }
    return '選手編' + who;
  }
  var team = (typeof S !== 'undefined' && S && TEAMS[S.team]) ? TEAMS[S.team].short : '';
  switch(kind){
    case 'introNews': return 'スカウト編 ― ' + team + '・2月（就任）';
    case 'scoutMonth': return 'スカウト編 ― ' + team + '・' + SCOUT_MONTHS[S.monthIdx] + 'の視察';
    case 'scoutList': return 'スカウト編 ― ' + team + '・' + SCOUT_MONTHS[S.monthIdx] + '（候補者リスト）';
    case 'scoutConfirm': return 'スカウト編 ― ' + team + '・会議前日';
    case 'scoutDraftPick': case 'scoutLottery': case 'lotteryNews': case 'featureNews': return 'スカウト編 ― ' + team + '・ドラフト会議当日';
    case 'scoutNegotiation': return 'スカウト編 ― ' + team + '・入団交渉の結果';
    case 'scoutCareerNews': return 'スカウト編 ― ' + team + '・6年後の答え合わせ';
  }
  return 'スカウト編 ― ' + team;
}
/* 会議状態 D の保存：結果リスト内の候補者はプールへの参照なので ID に置換し、
   入団合意／拒否リストは「結果リスト内の位置」で保持して復元時に再リンクする */
function serializeD(){
  if(typeof D === 'undefined' || !D) return null;
  var d = clonePlain(D);
  function locate(p){ for(var ti = 0; ti < 12; ti++){ var arr = D.results[ti] || []; var ix = arr.indexOf(p); if(ix >= 0) return {ti:ti, idx:ix}; } return null; }
  d.results = {};
  TEAMS.forEach(function(t, ti){ d.results[ti] = (D.results[ti] || []).map(function(p){ return {candId:p.cand.id, round:p.round, type:p.type, auto:!!p.auto, hazure:!!p.hazure}; }); });
  d._joinedRefs = (D.joined || []).map(locate);
  d._refusalRefs = (D.refusals || []).map(locate);
  delete d.joined; delete d.refusals;
  d.pendingLottery = (D.pendingLottery && D.pendingLottery.cand) ? {candId:D.pendingLottery.cand.id, teams:D.pendingLottery.teams.slice()} : null;
  d.featureQueue = (D.featureQueue || []).map(function(f){ return {candId:f.cand.id, team:f.team, round:f.round, type:f.type, kind:f.kind}; });
  d.miniNews = (D.miniNews || []).map(function(f){ return {candId:f.cand.id, team:f.team, round:f.round, type:f.type}; });
  if(D.finalResult){
    var fr = D.finalResult;
    d._finalResultSer = {rankPos:fr.rankPos, grade:fr.grade, ownGot:fr.ownGot, ownCount:fr.ownCount,
      teamTotals: fr.teamTotals.map(function(tt){ return {team:tt.team, total:tt.total, details: tt.details.map(function(dd){ return {pickRef:locate(dd.pick), outcome:clonePlain(dd.outcome), joined:dd.joined}; })}; })};
    delete d.finalResult;
  }
  return d;
}
function deserializeD(d){
  if(!d) return null;
  var byId = {}; S.pool.forEach(function(c){ byId[c.id] = c; });
  var out = d;
  var rawResults = d.results || {};
  out.results = {};
  TEAMS.forEach(function(t, ti){ out.results[ti] = (rawResults[ti] || []).map(function(p){ return {cand:byId[p.candId], round:p.round, type:p.type, auto:!!p.auto, hazure:!!p.hazure}; }); });
  function deref(ref){ return (ref && out.results[ref.ti] && out.results[ref.ti][ref.idx]) || null; }
  out.joined = (d._joinedRefs || []).map(deref).filter(function(x){ return !!x; });
  out.refusals = (d._refusalRefs || []).map(deref).filter(function(x){ return !!x; });
  delete out._joinedRefs; delete out._refusalRefs;
  out.pendingLottery = (d.pendingLottery && d.pendingLottery.candId != null && byId[d.pendingLottery.candId]) ? {cand:byId[d.pendingLottery.candId], teams:d.pendingLottery.teams} : null;
  out.featureQueue = (d.featureQueue || []).map(function(f){ return {cand:byId[f.candId], team:f.team, round:f.round, type:f.type, kind:f.kind}; }).filter(function(f){ return !!f.cand; });
  out.miniNews = (d.miniNews || []).map(function(f){ return {cand:byId[f.candId], team:f.team, round:f.round, type:f.type}; }).filter(function(f){ return !!f.cand; });
  if(d._finalResultSer){
    var fr = d._finalResultSer;
    var tts = fr.teamTotals.map(function(tt){ return {team:tt.team, total:tt.total, details: tt.details.map(function(dd){ return {pick:deref(dd.pickRef), outcome:dd.outcome, joined:dd.joined}; })}; });
    out.finalResult = {rankPos:fr.rankPos, grade:fr.grade, ownGot:fr.ownGot, ownCount:fr.ownCount, teamTotals:tts, myTT: tts.filter(function(tt){ return tt.team === S.team; })[0]};
    delete out._finalResultSer;
  }
  return out;
}
function saveProgress(mode, kind, extra){
  try{
    if(mode === 'player' && (typeof P === 'undefined' || !P)) return;
    if(mode === 'scout' && (typeof S === 'undefined' || !S)) return;
    var screen = {kind:kind};
    if(extra){ for(var k in extra) screen[k] = extra[k]; }
    var data = {v:1, mode:mode, label:progressLabel(mode, kind), savedAt:Date.now(), screen:screen,
      candSeq:(typeof candSeq !== 'undefined' ? candSeq : 1),
      listState:clonePlain(listState), draftFilter:clonePlain(draftFilter), P:null, PD:null, S:null, D:null};
    if(mode === 'player'){ data.P = clonePlain(P); data.PD = (typeof PD !== 'undefined' && PD) ? clonePlain(PD) : null; }
    else { data.S = clonePlain(S); data.D = serializeD(); }
    localStorage.setItem(PROG_KEY, JSON.stringify(data));
  }catch(e){}
}
/* 新規開始の確認：進行中セーブがあるときだけ、破棄の確認を挟む */
function guardNewGame(pending){
  if(_bypassNew) return false;
  var sv = progLoad(); if(!sv) return false;
  _pendingNew = pending;
  openModal('<b style="font-size:16px;">進行中のセーブがあります</b>'
    + '<p>「' + esc(sv.label || '進行中のゲーム') + '」のセーブが残っています。新しく始めると、このセーブは破棄されます。</p>'
    + '<button class="btn red" onclick="confirmNewGameStart()">セーブを破棄して新しく始める</button>'
    + '<button class="btn ghost" onclick="closeModal()">やめる（セーブを残す）</button>');
  return true;
}
function confirmNewGameStart(){
  var p = _pendingNew; _pendingNew = null;
  clearProgressSave(); closeModal();
  _bypassNew = true;
  try{ if(p && p.mode === 'scout') startScoutMode(p.ti); else startPlayerMode(); }finally{ _bypassNew = false; }
}
function clearProgressFromTitle(){
  var b = document.getElementById('progClearBtn');
  if(b && b.dataset.armed){ clearProgressSave(); showTitle(); return; }
  if(b){ b.dataset.armed = '1'; b.textContent = '本当に消しますか？（もう一度押すと消去）'; }
}
/* 選手編ドラフト当日のフィード1件分（進行表示と復元表示で同じ文面を使う） */
function feedEntryHtml(pk){
  var label = pk.type === 'ikusei' ? '育成' + pk.round + '巡目' : pk.round + '巡目';
  if(pk.cand.id === 9999){
    return label + '｜<span class="hl">' + TEAMS[pk.team].name + '</span> ― <span class="me">' + esc(pk.cand.name) + '</span>（' + esc(pk.cand.pos) + '）' + (pk.contested > 1 ? '【' + pk.contested + '球団競合・抽選の末】' : '') + (pk.hazure ? '【外れ1位】' : '');
  }
  var shock = pickShockText(pk.cand, pk.round, pk.type);
  return label + '｜' + TEAMS[pk.team].short + ' ― ' + esc(pk.cand.name) + '（' + esc(pk.cand.pos) + '・' + esc(CAT_LABEL[pk.cand.cat]) + '）｜' + esc(candOrg(pk.cand)) + (shock ? ' <b>' + shock + '</b>' : '') + (pk.contested > 1 ? '【' + pk.contested + '球団競合】' : '') + (pk.hazure ? '【外れ1位】' : '');
}
function feedMiniHtml(pk){
  if(pk.cand.id !== 9999 && (pk.cand.cat === 'overseas' || pk.cand.cat === 'odd')) return miniNewsHtml({cand:pk.cand, team:pk.team, round:pk.round, type:pk.type});
  return '';
}
/* 選手編ドラフト当日の復元表示：PD.idx までの指名をフィードに再現し、続きから操作できるようにする */
function renderPlayerDraftRestore(){
  var html = playerStatusCard()
    + '<div class="month-head"><span class="m">会議当日</span><span class="y">ドラフト会議（' + esc(PD.fromLabel) + '）</span></div>'
    + '<p class="lead">会議室の映像が流れ、司会の声が響く。「第1巡目、選択希望選手の発表です」——テレビの前、家族と固唾を呑んで見守る。自分の名前は、呼ばれるか。</p>'
    + (PD.r1nom.length >= 2 ? '<div class="notice"><b>速報：</b>1巡目であなたの名前を挙げた球団が複数あるという情報が流れている。競合すれば抽選だ。</div>' : '')
    + '<div class="log pickfeed" id="draftFeed"><div>―― 指名が始まった ――</div>';
  var hit = false;
  for(var i = 0; i < PD.idx && i < PD.picks.length; i++){
    var pk = PD.picks[i];
    html += '<div>' + feedEntryHtml(pk) + '</div>';
    var mh = feedMiniHtml(pk); if(mh) html += '<div>' + mh + '</div>';
    if(pk.cand.id === 9999) hit = true;
  }
  html += '</div><div id="draftCtl">';
  if(!hit && PD.idx < PD.picks.length){
    if(PD.idx === 0) html += '<button class="btn" onclick="revealPicks()">次の指名を見る</button>';
    else { var nx = PD.picks[PD.idx]; html += '<button class="btn" onclick="revealPicks()">次の指名を見る（次は' + (nx.type === 'ikusei' ? '育成' : '') + nx.round + '巡目）</button>'; }
  }
  html += '</div>';
  setView(html);
  if(hit) playerDrafted();
  else if(PD.idx >= PD.picks.length && PD.picks.length) playerUndrafted();
}
function resumePlayerScreen(sc){
  switch(sc.kind){
    case 'introNews': showNews(sc.head, sc.sub, sc.body, sc.side, function(){ playerMonth(); }); break;
    case 'playerFlow': runFlowStep(); break;
    case 'playerFlowResult':
      setView(playerStatusCard()
        + '<div class="card"><p class="lead">' + sc.msg + '</p><p class="small">現在のスカウト評価（注目度）は <b>' + Math.round(P.eval) + '</b>、メディア予想は <b>' + playerBand() + '</b>。</p></div>'
        + '<button class="btn" onclick="advanceFlow()">次へ進む</button>'); break;
    case 'playerOctober': playerOctober(); break;
    case 'playerOctVisitResult':
      setView(playerStatusCard()
        + '<div class="card"><p class="lead">' + sc.msg + '</p><p class="small">これで会議前の材料は出そろった。現在の評価（注目度）は <b>' + Math.round(P.eval) + '</b>、最終予想は <b>' + playerBand() + '</b>。</p></div>'
        + '<button class="btn red" onclick="playerOctoberDecision()">運命の決断へ</button>'); break;
    case 'playerMlbOffer': renderMlbOfferScreen(); break;
    case 'playerSubmitChoice': playerSubmitChoice(); break;
    case 'playerPathChoice': playerPathChoice(P._pathMsg || '進路を選ぶ。'); break;
    case 'playerOffers': renderPathOffers(sc.lead || '声がかかった所属先が届いた。どこで力を付けるかは、自分で選べる。'); break;
    case 'playerPathYear': pathYearScreen(); break;
    case 'playerPathEvent': pathEventScreen(); break;
    case 'playerPathYearEnd': renderPathYearEnd(); break;
    case 'playerTransfer': showTransferScreen(); break;
    case 'playerTransferDone':
      setView(playerStatusCard()
        + '<div class="month-head"><span class="m">転進が決まった</span><span class="y">' + P.age + '歳｜あと' + Math.max(0, 26 - P.age) + '年挑戦できる</span></div>'
        + '<div class="card"><p class="lead">' + esc(sc.story || '') + '</p><p class="lead">新しい所属は <b>' + esc(sc.orgText || '') + '</b>。球歴にも新しいステージが加わった。</p><p class="small">この舞台の特徴：' + esc(pathTraitText(sc.type)) + '</p></div>'
        + '<button class="btn" onclick="pathYearScreen()">新しい舞台で1年目を始める</button>'); break;
    case 'playerDraftStart': case 'playerDraftReveal': renderPlayerDraftRestore(); break;
    case 'playerDeclineNews': showDeclineNews(sc.head, sc.sub, sc.body, sc.side, sc.paper || null); break;
    default:
      if(P.curPath){ if(P._yearEnd) renderPathYearEnd(); else pathYearScreen(); }
      else playerMonth();
      break;
  }
}
function resumeScoutScreen(sc){
  switch(sc.kind){
    case 'introNews': showNews(sc.head, sc.sub, sc.body, sc.side, function(){ scoutMonth(); }); break;
    case 'scoutMonth': scoutMonth(); break;
    case 'scoutList': showCandidateList(); break;
    case 'scoutConfirm': confirmDraftDay(); break;
    case 'scoutDraftPick': renderDraftPickScreen(); break;
    case 'scoutLottery': renderLottery(); break;
    case 'lotteryNews': showNews(sc.head, sc.sub, sc.body, sc.side || '', function(){ finishHazure(sc.queue || [], !!sc.userNeedsPick); }); break;
    case 'featureNews': showNews(sc.head, sc.sub, sc.body, sc.side || '', function(){ if(sc.next === 'negotiation') negotiationPhase(); else renderDraftPickScreen(); }); break;
    case 'scoutNegotiation': negotiationPhase(); break;
    case 'scoutCareerNews':
      if(D && D.careerNews && D.finalResult) showNews(D.careerNews.head, D.careerNews.sub, D.careerNews.body, D.careerNews.side, function(){ scoutEnding(); });
      else negotiationPhase();
      break;
    default: scoutMonth(); break;
  }
}
function resumeGame(){
  var data = progLoad(); if(!data){ showTitle(); return; }
  closeModal();
  var ov = document.getElementById('newsOverlay'); if(ov) ov.classList.remove('open');
  newsCallback = null;
  candSeq = data.candSeq || 1;
  if(data.listState) listState = data.listState;
  if(data.draftFilter) draftFilter = data.draftFilter;
  var sc = data.screen || {};
  if(data.mode === 'player'){
    S = null; D = null; P = data.P; PD = data.PD || null;
    if(P && P.profile && P.careerStages) P.profile.stages = P.careerStages;
    /* 月の出来事は選択肢が関数を含むため、生成元インデックスから作り直す（内容は保存時と同一） */
    if(P && P.flow) P.flow.forEach(function(st){ if(st && st.ev && st.ev._idx != null){ var ix = st.ev._idx; st.ev = EVENT_POOL[ix](); st.ev._idx = ix; } });
    resumePlayerScreen(sc);
  } else {
    P = null; PD = null; S = data.S;
    if(S && S.pool) S.pool.forEach(function(c){ if(c.profile && c.stages) c.profile.stages = c.stages; });
    D = deserializeD(data.D);
    resumeScoutScreen(sc);
  }
}

/* ============ SNS共有 ============ */
function shareBlock(text){
  var enc = encodeURIComponent(text);
  return '<div class="card"><h3 style="margin:4px 0 8px;">結果を共有する</h3>'
    + '<button class="btn small" onclick="doShare(\''+ text.replace(/'/g,"\\'") +'\')">共有シートを開く</button>'
    + '<div class="flex"><button class="btn small sub" onclick="window.open(\'https://twitter.com/intent/tweet?text='+enc+'\',\'_blank\')">Xで投稿</button>'
    + '<button class="btn small sub" onclick="window.open(\'https://social-plugins.line.me/lineit/share?text='+enc+'\',\'_blank\')">LINEで送る</button></div>'
    + '<button class="btn small ghost" onclick="copyShare(this,\''+ text.replace(/'/g,"\\'") +'\')">テキストをコピー</button>'
    + '<a class="btn small sub" href="https://life-sim-games.github.io/" target="_blank" rel="noopener" style="text-decoration:none;">🎮 他のゲームも遊ぶ</a></div>';
}
function doShare(text){
  if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
  else { copyShare(null, text); }
}
function copyShare(btn, text){
  function done(){ if(btn){ var o = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(function(){ btn.textContent = o; }, 1600); } }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(done); }
  else {
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done();
  }
}

var P = null;
/* ============ 選手編：主人公の球歴チェーン（ゲーム進行に合わせて伸びていく） ============
   P.careerStages が唯一の正本。所属が変わるたびにステージを追加し、
   プロフィール表示・記録サマリー・アーカイブはすべてここから描く */
function playerCareerChainText(){ return careerChainText((typeof P!=='undefined' && P && P.careerStages) || []); }
function syncProfileCareer(){ if(typeof P!=='undefined' && P && P.profile){ P.profile.stages = P.careerStages; P.profile.career = playerCareerChainText(); } }
function pushCareerStage(st){ if(typeof P==='undefined' || !P) return; if(!P.careerStages) P.careerStages = P.profile ? P.profile.stages : []; P.careerStages.push(st); syncProfileCareer(); }
function statSummaryOf(a){
  if(!a) return '';
  if(isTwoWayP() && a.outs!=null && a.ab!=null){
    var pSum = a.g+'試合 '+a.w+'勝'+a.l+'敗 防御率'+statEraOf(a).toFixed(2)+' 奪三振'+a.so;
    var bSum = '打者：'+a.g+'試合 打率'+avgStr(statAvgOf(a))+' '+a.hr+'本塁打 '+a.rbi+'打点';
    return (P.pos==='投手') ? pSum+'／'+bSum : bSum+'／投手：'+a.w+'勝'+a.l+'敗 防御率'+statEraOf(a).toFixed(2)+' 奪三振'+a.so;
  }
  if(P.pos==='投手') return a.g+'試合 '+a.w+'勝'+a.l+'敗 防御率'+statEraOf(a).toFixed(2)+' 奪三振'+a.so;
  return a.g+'試合 打率'+avgStr(statAvgOf(a))+' '+a.hr+'本塁打 '+a.rbi+'打点';
}
/* 選手編で新しい所属ステージを始めるときの初期化。
   候補者（スカウト編）用のステージ生成には「既に残した実績」として作り置きの実績文が入るが、
   主人公についてはシーズンを戦う前から成績・実績が確定しているように見えてしまうため、
   実績文（ach／memo／タイトル系フラグ）は空にして所属情報だけにする。
   実績文はシーズンが実際に終わった時点で attachStageSeason がその年の結果から初めて付ける */
function freshPlayerStage(st){
  st.ach = ''; st.memo = ''; st.nat = false; st.title = false;
  return st;
}
/* 実際に終わった1シーズンの成績から、その年の出来事を一言で表す（記録サマリー「歩んだ道」用）。
   q は同ステージ内での「最も印象的なシーズン」を選ぶための質スコア */
function seasonMilestoneOf(a){
  if(!a || !a.g) return null;
  if(isTwoWayP() && a.outs!=null && a.ab!=null){
    var e2 = statEraOf(a), av2 = statAvgOf(a);
    var pt = e2<=2.60 ? '防御率'+e2.toFixed(2)+'・'+a.w+'勝の好投' : '防御率'+e2.toFixed(2)+'の投球';
    var bt2 = av2>=0.280 ? '打率'+avgStr(av2)+'・'+a.hr+'本塁打と打っても結果を残した' : '打者としても打率'+avgStr(av2)+'・'+a.hr+'本塁打を記録した';
    return {text:pt+'を見せ、'+bt2+'二刀流ぶり', q:Math.max((5.5-e2)+a.w*0.15, av2*10+a.hr*0.1)};
  }
  if(P.pos==='投手'){
    var era = statEraOf(a);
    var txt = era<=2.00 ? '防御率'+era.toFixed(2)+'・'+a.w+'勝と圧巻の投球を見せた'
      : era<=2.60 ? '防御率'+era.toFixed(2)+'・'+a.w+'勝とエース級の活躍を見せた'
      : era<=3.40 ? '防御率'+era.toFixed(2)+'と安定した成績を残した'
      : era<=4.50 ? '防御率'+era.toFixed(2)+'とまずまずのシーズンを送った'
      : '防御率'+era.toFixed(2)+'と苦しいシーズンも経験した';
    return {text:txt, q:(5.5-era)+a.w*0.15};
  }
  var avg = statAvgOf(a), avgs = avgStr(avg);
  var btxt = avg>=0.310 ? '打率'+avgs+'・'+a.hr+'本塁打と打ちまくった'
    : avg>=0.280 ? '打率'+avgs+'・'+a.hr+'本塁打と結果を残した'
    : avg>=0.240 ? '打率'+avgs+'とレギュラーとして働いた'
    : '打率'+avgs+'と苦戦のシーズンもあった';
  return {text:btxt, q:avg*10+a.hr*0.1};
}
/* 現在の所属ステージに、その年のシーズン成績（実績）を紐付ける */
function attachStageSeason(a){
  if(typeof P==='undefined' || !P || !P.careerStages || !P.careerStages.length || !a) return;
  var st = P.careerStages[P.careerStages.length-1];
  st.ach = (st.ach ? st.ach+'｜' : '') + pathSeasonLabel()+'：'+statSummaryOf(a);
  var ms = seasonMilestoneOf(a);

  syncProfileCareer();
}
/* 高校ステージの実績は、実際に起きた甲子園結果と高校3年の通算成績で確定させる */
function finalizeHSStage(){
  if(typeof P==='undefined' || !P || P._hsStageDone || !P.careerStages || !P.careerStages.length) return;
  P._hsStageDone = true;
  var st = P.careerStages[P.careerStages.length-1];
  var agg = null;
  (P.seasonStats||[]).forEach(function(a){
    if(!agg){ agg = {}; Object.keys(a).forEach(function(k){ agg[k]=a[k]; }); return; }
    Object.keys(a).forEach(function(k){ if(typeof a[k]==='number') agg[k]=(agg[k]||0)+a[k]; });
  });
  var res = (P.koshienWin||0)>=4 ? '甲子園優勝' : (P.koshienWin||0)>=3 ? '甲子園準優勝' : (P.koshienWin||0)>=2 ? '甲子園ベスト4' : (P.koshienWin||0)>=1 ? '甲子園出場（1勝）' : (P.koshien ? '甲子園出場' : '夏の予選で敗退');
  st.ach = res + (agg && agg.g ? '／高校3年の成績：'+statSummaryOf(agg) : '');
  st.milestone = (P.koshienWin||0)>=4 ? '甲子園で優勝した' : (P.koshienWin||0)>=3 ? '甲子園で準優勝した' : (P.koshienWin||0)>=2 ? '甲子園ベスト4まで勝ち進んだ' : (P.koshienWin||0)>=1 ? '甲子園で1勝を挙げた' : (P.koshien ? '甲子園出場を果たした' : '甲子園には届かなかった');
  syncProfileCareer();

function newStatAcc(label){
  if(!P.seasonStats) P.seasonStats = [];
  var a = {label: label};
  var twA = isTwoWayP();
  if(P.pos==='投手' || twA){ a.g=0; a.outs=0; a.w=0; a.l=0; a.er=0; a.so=0; }
  if(P.pos!=='投手' || twA){ if(a.g==null) a.g=0; a.ab=0; a.h=0; a.hr=0; a.rbi=0; a.sb=0; }
  P.seasonStats.push(a);

}
function accFor(key, label){
  if(!P._accMap) P._accMap = {};
  if(!P._accMap[key]) P._accMap[key] = newStatAcc(label);

}
function fmtIP(outs){ return Math.floor(outs/3)+'.'+(outs%3); }
function statEraOf(a){ var inn = a.outs/3; return inn>0 ? (a.er*9/inn) : 0; }

function recordMatchStats(key, label, win, hero, perf, opp){
  var a = accFor(key, label);
  var isPractice = (key==='practice');
  if(P.pos==='投手' || isTwoWayP()){
    var outs = isPractice ? ri(9,18) : (win ? ri(18,27) : ri(12,24));
    if(hero) outs = Math.min(27, outs + ri(0,3));
    a.g += 1; a.outs += outs;
    var er;
    if(hero) er = ri(0,1);
    else if(win) er = ri(0,2);
    else er = ri(2,5);
    if(P.ability>=72 && er>0 && Math.random()<0.4) er -= 1;
    a.er += Math.max(0, er);
    a.so += Math.max(0, Math.round((outs/3) * clamp(0.45 + P.ability/110, 0.5, 1.35) * rf(0.7,1.35)));
    if(win && Math.random()<0.8) a.w += 1;
    if(!win && Math.random()<0.65) a.l += 1;

/* ============ 選手編：ドラフト当日の「実勢評価」と順位帯の設計 ============
   順位帯の役割：1〜2位＝全国実績のあるエリートのみ／3〜4位＝実力の確かな大学・社会人と
   高卒の上位層／5位以下＝力を付けてきた進路組・掘り出し物／育成＝原石の入口。
   高卒は甲子園優勝級・評価トップ層だけがそのまま指名され、強いが一歩足りない選手は
   進路で力を付けてから指名されるのが普通の流れになるよう、高校段階だけ実勢を絞る */
function hsEliteTier(){
  var kw = P.koshienWin||0;
  if(kw>=4 || P.eval>=88 || (P.ability>=80 && kw>=3)) return 'elite'; /* 甲子園優勝級／評価トップ層 */
  if(P.eval>=76 && (P.koshien || kw>=1 || P.ability>=72)) return 'upper'; /* 高卒の上位層：中位指名まで */
  if(P.eval>=60) return 'prospect'; /* 原石：下位・育成の入口まで */
  return 'long';
}
/* 進路で過ごした年数（高校卒業後の年数）。pathYear はドラフト前に進むため、
   年齢（18歳＝高卒時点）からの差分で数えるのが最も壊れにくい：
   進路を選び直して pathYear がリセットされても、積み上げた年数は年齢に残る */
function playerPathYears(){ return clamp((P.age||18) - 18, 0, 8); }
/* 本当のエリート域：実力85前後＋高い評価が両方そろったときだけ上位の扉が開く */
function playerIsElitePath(){ return P.ability>=83 && P.eval>=80; }
/* 進路年次ごとの実勢上限。1年目は誰でも下位・育成が天井（1位候補級には絶対にならない）。
   年を重ねるほど天井は上がるが、上位（72以上）に届くのはエリート域の選手だけ */
function playerDraftCap(){
  if(!P.curPath) return 99;
  var y = playerPathYears(), elite = playerIsElitePath();
  if(y<=1) return elite ? 60 : 53;
  if(y===2) return elite ? 74 : 60;
  if(y===3) return elite ? 84 : 66;
  return elite ? 97 : 71;
}
function playerDraftMedia(){
  var media = clamp(Math.round(P.eval+10), 20, 99);
  if(!P.curPath && P.age<=18){
    var t = hsEliteTier();
    if(t==='upper') media = Math.min(media, 67);
    else if(t==='prospect') media = Math.min(media, 47);
    else if(t==='long') media = Math.min(media, 36);
    return media;
  }
  /* 進路組は「その舞台で付けた力（実力）」が評価に乗り、中位〜下位と育成に厚く分布する。
     評価の伸びをそのまま順位に変換すると上位に寄りすぎるため、実勢は圧縮して変換したうえで、
     進路年次＋エリート判定による上限（playerDraftCap）で機械的に締める：
     進路1年目で高卒時の注目度が残っていても、突然1位指名候補にはならない */
  var raw = clamp(Math.round(52 + (P.eval-50)*0.55 + (P.ability-60)*0.30), 20, 97);
  return Math.min(raw, playerDraftCap());
}
function playerSubmit(){
  runPlayerDraftDay('高校卒業見込み');
}

/* ============ ドラフト会議エンジン（自動進行・選手編用） ============ */
function autoDraft(pool, noise){
  var taken = {}, picks = [], r1nom = {};
  var shihaiTarget = {}, ikuseiTarget = {}, shihaiCount = {}, ikuseiCount = {};
  TEAMS.forEach(function(t,ti){ shihaiTarget[ti]=ri(5,7); ikuseiTarget[ti]=ri(0,3); shihaiCount[ti]=0; ikuseiCount[ti]=0; });
  function bestFor(ti, minV){
    var best=null, bv=-1;
    pool.forEach(function(c){ if(taken[c.id]) return; var v=teamValue(c,ti,noise); if(v>bv){bv=v;best=c;} });
    if(best && bv>=minV) return best; return null;
  }
  /* 1巡目：同時指名 */
  var noms = {};
  WAIVER.forEach(function(ti){ var b = bestFor(ti, 0); if(b){ if(!noms[b.id]) noms[b.id]=[]; noms[b.id].push(ti); } });
  Object.keys(noms).forEach(function(cid){ r1nom[cid] = noms[cid].slice(); });
  var losers = [];
  WAIVER.forEach(function(ti){
    var cid = null;
    Object.keys(noms).forEach(function(k){ if(noms[k].indexOf(ti)>=0) cid = k; });
    if(cid===null) return;
    var group = noms[cid];
    var b = pool.filter(function(x){ return x.id==cid; })[0];
    if(group.length===1){ taken[b.id]=true; shihaiCount[ti]++; picks.push({round:1, type:'shihai', team:ti, cand:b, contested:1}); }
  });
  /* 競合の抽選 */
  Object.keys(noms).forEach(function(cid){
    var group = noms[cid]; if(group.length<2) return;
    var c = pool.filter(function(x){return x.id==cid;})[0];
    var winner = pick(group);
    taken[c.id]=true; shihaiCount[winner]++;
    picks.push({round:1, type:'shihai', team:winner, cand:c, contested:group.length});
    group.forEach(function(ti){ if(ti!==winner) losers.push(ti); });
  });
  picks.sort(function(a,b){ return WAIVER.indexOf(a.team)-WAIVER.indexOf(b.team); });
  /* 外れ1位 */
  losers.sort(function(a,b){ return WAIVER.indexOf(a)-WAIVER.indexOf(b); });
  losers.forEach(function(ti){ var b = bestFor(ti, 55); if(b){ taken[b.id]=true; shihaiCount[ti]++; picks.push({round:1, type:'shihai', team:ti, cand:b, contested:0, hazure:true}); } });
  /* 2〜7巡目 */
  for(var r=2;r<=7;r++){
    WAIVER.forEach(function(ti){
      if(shihaiCount[ti]>=shihaiTarget[ti]) return;
      var b = bestFor(ti, 42); if(b){ taken[b.id]=true; shihaiCount[ti]++; picks.push({round:r, type:'shihai', team:ti, cand:b, contested:0}); }
    });
  }
  /* 育成ドラフト */
  for(var r2=1;r2<=3;r2++){
    WAIVER.forEach(function(ti){
      if(ikuseiCount[ti]>=ikuseiTarget[ti]) return;
      var b = bestFor(ti, 30); if(b){ taken[b.id]=true; ikuseiCount[ti]++; picks.push({round:r2, type:'ikusei', team:ti, cand:b, contested:0}); }
    });
  }
  return {picks:picks, r1nom:r1nom};
}

/* 記録サマリーの「歩んだ道」：球歴（正式な所属チェーン）とは別に、各ステージで
   何が起きたかを物語形式でつなぐ。材料はすべて実際に起きた結果
   （高校＝甲子園結果、各進路ステージ＝最も印象的だったシーズンの実績）から作る */
function playerJourneyText(){
  var stages = P.careerStages || [];
  var parts = [];
  stages.forEach(function(st){
    if(st.jh) return; /* 中学時代は球歴にのみ残し、歩んだ道は高校から始める */
    if(st.note==='NPB'){ parts.push(st.name+'から'+(st.ach || '指名を受けて入団')); return; }
    if(st.usMove){ parts.push((mlbParentOf(st.name)||'MLB球団')+'とマイナー契約を結び、渡米した'); return; }
    if(st.hs){
      var tier = P.schoolTier ? '（'+schoolTierLabel(P.schoolTier)+'）' : '';
      parts.push(st.name+tier+'では'+(st.milestone || '高校3年のシーズンを戦った'));
      return;
    }
    if(st.milestone){ parts.push((st.via==='transfer' ? '転進先の' : '')+st.name+'では'+st.milestone); return; }
    if(st.ach){ parts.push(st.name+'で'+st.ach); return; }
    parts.push(st.name+'でプレーした');
  });
  if(!parts.length) return P.path.map(function(p){ return p.label; }).join(' → ');
  return parts.join(' → ');
}

/* ============ 選手編エピローグ：プロキャリア・シミュレーション ============
   指名・入団が決まったエンディング専用の後日談。本編（指名されるまで）の

function genPathOffers(type, opts){
  opts = opts || {};
  var offers = [];
  var push = function(org){ if(org && org!==opts.excludeOrg && offers.indexOf(org)<0) offers.push(org); };
  if(opts.stayOrg) push(opts.stayOrg); /* 同じ舞台を選び直した場合は、今の所属からの継続オファーを必ず含める */
  var eliteScore = Math.max(P.ability||0, P.eval||0);

    var t1 = shuffle(UNIV_TIER1), t2 = shuffle(UNIV_TIER2);

    if(eliteScore>=78 || Math.random()<0.18) push(t1[0]); /* 強豪（六大学・青学級）は条件付き */

/* ============ 選手編：MLBマイナー→メジャー昇格ルートと、MLB（メジャー）での年次 ============
   マイナー（curPath==='mlb'）の各年の終わりに、その年に実際に記録されたシーズン成績と
   積み上げてきた実力から「メジャー昇格判定」を行う。昇格すると舞台は 'mlbM'（MLB・メジャー）に移り、
   在籍中はドラフト対象外（26歳の強制ドラフトも発動しない）。成績が悪い年は3A降格・戦力外の判定がある */
/* 親球団名（文字列）を返す。P.mlbOrg は年次生活では文字列（親球団名）。
   組織オブジェクトの形で保持されるのは高校からの直接オファー画面が出ている間だけで、
   契約を受けて年次生活に入る時点で文字列に統一される */
function mlbOrgName(){
  if(typeof P.mlbOrg==='string' && P.mlbOrg) return P.mlbOrg;
  if(P.mlbOrg && P.mlbOrg.mlb) return P.mlbOrg.mlb;
  return mlbParentOf(P._mlbAaa || P.pathOrg) || '';
}
function mlbOrgByMlbName(name){ for(var i=0;i<MLB_ORGS.length;i++){ if(MLB_ORGS[i].mlb===name) return MLB_ORGS[i]; } return null; }
/* 区分線形補間：[[値, スコア], ...]（値は昇順）からスコアを引く */
function pieceScore(x, pts){
  if(x<=pts[0][0]) return pts[0][1];
  for(var i=1;i<pts.length;i++){
    if(x<=pts[i][0]){ var p0 = pts[i-1], p1 = pts[i]; return p0[1] + (p1[1]-p0[1]) * (x-p0[0]) / (p1[0]-p0[0]); }
  }
  return pts[pts.length-1][1];
}
/* その年の実際のシーズン成績を0〜100の成績評価（perf）に換算する。
   投手は防御率が軸（1.50→100／2.50→80／3.50→55／4.50→30）で、投球回が多いほど信頼度が上がる。
   野手は打率が軸（.320→100／.290→78／.260→55／.230→32）に本塁打の加点を足す */
function mlbPerfScore(a){
  if(!a) return 0;
  if(P.pos==='投手'){
    if(a.outs==null) return 0;
    var era = statEraOf(a), inn = a.outs/3;
    var s = pieceScore(era, [[1.0,104],[1.5,100],[2.5,80],[3.5,55],[4.5,30],[5.5,12],[6.5,4]]);
    var rel = clamp(inn/150, 0.6, 1); /* 投球回が多いほど「まぐれではない」成績として信頼度が上がる */
    return clamp(Math.round(s * (0.82 + 0.18*rel)), 0, 100);
  }
  if(a.ab==null) return 0;
  var avg = statAvgOf(a);
  var s2 = pieceScore(avg, [[0.200,16],[0.230,32],[0.260,55],[0.290,78],[0.320,100],[0.350,106]]);
  var rel2 = clamp((a.g||0)/120, 0.6, 1);
  return clamp(Math.round(s2 * (0.82 + 0.18*rel2) + Math.min(12, (a.hr||0)*0.5)), 0, 100);
}
/* 昇格に届かなかった年、「あと何が足りないか」の目安（最も弱い要素から作る） */
function mlbPromoHint(a){
  if(!a) return 'シーズンを通した数字そのもの';
  if(P.pos==='投手'){
    var era = statEraOf(a), inn = (a.outs||0)/3;
    if(era>3.2) return '防御率を2点台に乗せる投球（今季 '+era.toFixed(2)+'）';
    if(inn<120) return 'シーズンを通して投げ切る投球回（今季 '+Math.floor(inn)+'回／目安は150回）';
    return '球団内での序列を上げる実力そのもの（成績は届いている。あとは枠とタイミング）';
  }
  var avg = statAvgOf(a);
  if(avg<0.265) return '打率を.280台に乗せるコンタクト（今季 '+avgStr(avg)+'）';
  if((a.hr||0)<12) return '長打力のアピール（今季 '+(a.hr||0)+'本塁打）';
  return '球団内での序列を上げる実力そのもの（成績は届いている。あとは枠とタイミング）';
}
/* メジャー昇格判定：スコア＝実力×0.4＋その年の成績評価×0.6。
   防御率1点台〜2.50のシーズンを続ける投手は1〜3年以内にほぼ昇格し、平凡な3A成績では滅多に上がれないバランス */
function judgeMlbPromotion(){
  var a = (P.seasonStats && P.seasonStats.length) ? P.seasonStats[P.seasonStats.length-1] : null;
  var perf = mlbPerfScore(a);
  var score = Math.round(P.ability*0.4 + perf*0.6);
  var prob = score>=85 ? 0.65 : score>=75 ? 0.45 : score>=65 ? 0.28 : score>=55 ? 0.15 : 0.05;
  return {promoted: Math.random()<prob, score:score, perf:perf, prob:prob, hint: mlbPromoHint(a)};
}
/* 昇格を受け入れる：新聞一面で報じ、舞台を 'mlbM'（MLB・メジャー）へ移す */
function acceptPromotion(){
  var aaa = P.pathOrg;
  var mo = mlbOrgName();
  if(!mo){ var o0 = pick(MLB_ORGS); mo = o0.mlb; }
  P.mlbOrg = mo;
  P._mlbAaa = aaa;
  P.curPath = 'mlbM'; P.pathYear = 1; P.pathOrg = mo; P._yearEnd = null; P._mlbBad = 0;
  P.mlbDebutAge = P.age;
  P.path.push({label:'MLB昇格：'+mo});
  pushCareerStage(stageObj(mo, 'MLB', {text:'傘下3Aからメジャー昇格を果たした'}));

    '昇格の決め手は、今季3Aで残した成績と、積み上げてきた実力。',

/* ============ 引退勧告の岐路（MLB／MLBマイナー共通） ============
   年齢が進み（シーズン年齢35歳以上）成績が衰えてきた選手のうち、アメリカで実績を
   積んだ選手にだけ、球団（メジャー）または代理人経由で親球団（マイナー）から
   「引退セレモニー（引退試合）を用意する。今季限りで区切りをつけないか」という
   勧告が届く。実績の乏しい選手には来ない（従来どおり降格・DFA・戦力外の流れ）。
   降格・DFA・トレードの岐路とは別イベントで、同じ年には重ならないよう、
   それらの分岐が無い年にだけ発生を振る。発生結果は _yearEnd に保存されるため、
   勧告の場面で途中セーブ／再開しても同じ勧告が同じ条件で出し直される。
   断った球団（組織）からは二度と来ない（P._recDeclinedOrgs に球団名を記録する） */
/* アメリカ（マイナー／メジャー）の年度成績を舞台別に集計する */
function usCareerAgg(){
  var minor = [], major = [];
  (P.seasonStats||[]).forEach(function(a){ var st = seasonStageOf(a); if(st==='mlb') minor.push(a); else if(st==='mlbM') major.push(a); });
  function agg(list){
    var t = {g:0, w:0, l:0, so:0, ab:0, h:0, hr:0, rbi:0};
    list.forEach(function(a){ ['g','w','l','so','ab','h','hr','rbi'].forEach(function(k){ t[k] += (a[k]||0); }); });
    return t;
  }
  return {minorYears:minor.length, majorYears:major.length, minor:agg(minor), major:agg(major)};
}
/* 引退勧告が来るだけの「実績」があるか：メジャー在籍年数・獲得タイトル・アメリカ通算成績で判定する */
function retireRecAccomplished(){
  var u = usCareerAgg();
  if(u.majorYears>=3) return true;
  if((P.mlbTitles||[]).length>=1 && u.majorYears>=2) return true;
  if(P.pos==='投手'){
    if(u.major.w>=50 || u.major.so>=800) return true;
    if(u.majorYears>=1 && (u.minor.w+u.major.w>=70 || u.minor.so+u.major.so>=900)) return true;
    if(u.minorYears>=6 && (u.minor.w>=60 || u.minor.so>=700)) return true;
  } else {
    if(u.major.h>=500 || u.major.hr>=80) return true;
    if(u.majorYears>=1 && (u.minor.h+u.major.h>=800 || u.minor.hr+u.major.hr>=110)) return true;
    if(u.minorYears>=6 && (u.minor.h>=700 || u.minor.hr>=100)) return true;
  }
  return false;
}
/* この球団（組織）からの勧告を既に断っているか。断った球団からは二度と来ない */
function retireRecOrgBlocked(){
  return (P._recDeclinedOrgs||[]).indexOf(mlbOrgName())>=0;
}

/* 引退勧告を断る：現役続行。断った球団からは二度と来ない。選んだ事実は球歴・記録に残る */
function retireRecDecline(){
  var org = mlbOrgName();

    renderPathYearEnd();

/* MLB（メジャー）での年次終了：成長を加えたうえで、その年の成績から降格・戦力外・定着を判定する */
function finishMlbMajorYear(msg, msg2){
  var trait = PATH_TRAITS[P.curPath] || {growthMin:1, growthMax:3, evalMul:0.3};
  var finishedYear = P.pathYear;
  var ageNow = P.age; /* このシーズンを戦った年齢 */
  var ageNext = P.age + 1;
  /* 実力の年齢カーブ：〜29歳は微増あり、30〜33歳は維持、34歳からは年齢とともに確実に落ちる。
     年度成績は実力連動で生成されるため、数字も自然に落ちていく */
  var growth;
  if(ageNow<=29) growth = ri(0,2);
  else if(ageNow<=33) growth = ri(-1,1);
  else if(ageNow<=36) growth = -ri(1,2);
  else if(ageNow<=39) growth = -ri(2,3);
  else growth = -ri(3,5);
  P.ability = clamp(P.ability + growth, 1, 99);
  var evalGain = growth>=0 ? Math.max(1, Math.round(growth*trait.evalMul)) : growth;
  P.eval = clamp(P.eval + evalGain, 0, 99);
  var a = (P.seasonStats && P.seasonStats.length) ? P.seasonStats[P.seasonStats.length-1] : null;
  var perf = mlbPerfScore(a);
  /* 好成績の年はタイトルの可能性（オールスター選出など） */
  if(perf>=75 && Math.random()<0.45){ if(!P.mlbTitles) P.mlbTitles = []; P.mlbTitles.push('MLBオールスター選出'); }
  if(P.tags.indexOf('守備職人')>=0 && perf>=60 && Math.random()<0.2){ if(!P.mlbTitles) P.mlbTitles = []; P.mlbTitles.push('ゴールドグラブ賞'); }
  if(perf<48) P._mlbBad = (P._mlbBad||0)+1; else P._mlbBad = 0;
  /* トレードの際に残留を訴えた過去があると、球団内での立場が微妙になり、この年の降格・戦力外判定が少し重くなる（この年で消費する） */
  var appealMark = !!P._appealMark; P._appealMark = false;
  var dp = perf<38 ? 0.75 : perf<48 ? 0.40 : perf<55 ? 0.12 : 0.03; /* 成績が悪い年ほど3A降格の判定が重い */
  if(appealMark) dp += 0.10;
  var demoted = Math.random()<dp;
  var released = demoted && ((P._mlbBad||0)>=2 || ageNext>=37); /* 不振の継続、または高齢での降格は戦力外に直結する */
  /* 年齢連動の戦力外：37歳以降は平凡な成績でも契約を切られやすくなり、40歳以降は毎年高確率で判定が入る */
  if(ageNow>=40){ var relP40 = perf>=75 ? 0.45 : perf>=60 ? 0.60 : 0.75; if(Math.random()<relP40) released = true; }
  else if(ageNow>=37 && perf<62 && Math.random()<(appealMark ? 0.45 : 0.35)) released = true;
  if(released) demoted = true;
  /* ハードリミット：44歳のシーズンを終えたら、必ず現役の終わりの分岐に入る（45歳以上の現役は作らない） */
  var hardRetire = ageNow>=44;
  /* トレードの岐路：降格・戦力外・引退の分岐が無い年にだけ、球団事情でトレードが決まることがある。
     成績の良い選手ほど「勝負の年の補強」として欲しがられ、高齢の選手は年俸整理の対象にもなる。
     毎年必ず起きる頻度にはせず、移籍した直後の年は連続で動かさない。行き先はこの時点で確定させ、
     _yearEnd に保存するので、岐路の画面で途中セーブ／再開しても同じトレードが提示される */
  var tradeTo = '';
  if(!demoted && !released && !hardRetire){
    var tp = 0.08 + (perf>=65 ? 0.06 : 0) + (ageNow>=33 ? 0.03 : 0);
    if(P._lastTradeAge != null && ageNow - P._lastTradeAge <= 1) tp = 0;
    if(Math.random() < tp){
      var curOrgName = mlbOrgName();
      var tcands = MLB_ORGS.filter(function(o){ return o.mlb !== curOrgName; });
      if(tcands.length) tradeTo = pick(tcands).mlb;
    }
  }
  /* 引退勧告の岐路：降格・DFA・トレード・44歳の限界とは別イベントとして、同じ年に重ならないよう
     それらの分岐が無い年にだけ振る（結果は _yearEnd に保存され、再開でも同じ勧告が出る） */
  var retireRec = false;
  if(!demoted && !released && !hardRetire && !tradeTo) retireRec = rollRetireRec(perf, ageNow);
  P.age++; P.pathYear++;
  P.cond = clamp(P.cond+6, 0, 100);
  P._yearEnd = {fromPath:'mlbM', fromLabel:'MLB'+finishedYear+'年目', eligible:false, optionalDraft:false, forcedReason:'', graduation:false, growth:growth, evalGain:evalGain, msg:msg, msg2:msg2, mlbM:{perf:perf, demoted:demoted, released:released, hardRetire:hardRetire, finYear:finishedYear, tradeTo:tradeTo, retireRec:retireRec}};
  renderPathYearEnd();
}

/* ============ MLB（メジャー）の岐路：トレード志願／FA／トレードへの反応 ============
   降格・DFA・トレードは自動で進めず、ここでプレイヤーの選択を受けて初めて結果が動く。
   成否の確率は「ボタンの説明に書いた見通し」と必ず同じ式（mlbMoveOdds）で判定する */
/* トレード志願（kind='trade'）／FA契約（kind='fa'）／ウェイバー獲得（kind='waiver'）の成立確率：その年の成績評価と年齢で変わる */
function mlbMoveOdds(kind, perf){
  var age = P.age, p;
  if(kind==='trade') p = 0.30 + perf*0.004 + (age<=29 ? 0.12 : age>=36 ? -0.14 : 0);
  else if(kind==='waiver') p = 0.28 + perf*0.0045 + (age<=29 ? 0.10 : age>=37 ? -0.16 : 0);
  else p = 0.22 + perf*0.005 + (age<=30 ? 0.14 : age>=37 ? -0.20 : 0);
  return clamp(Math.round(p*100)/100, 0.05, 0.80);
}
/* 確率をボタンの説明に載せるための見通し文（数値も併記する） */
function oddsText(p){
  var pct = Math.round(p*100);
  return (p>=0.65 ? 'かなり有望' : p>=0.5 ? '五分以上' : p>=0.35 ? '五分五分' : p>=0.2 ? 'やや厳しい' : 'かなり厳しい') + '（約'+pct+'%）';
}
/* 現在の所属以外のMLB球団を1つ選ぶ（トレード先・FA移籍先用） */
function pickOtherMlbOrg(){
  var cur = mlbOrgName();
  var cands = MLB_ORGS.filter(function(o){ return o.mlb !== cur; });
  return cands.length ? pick(cands).mlb : cur;
}
/* 所属球団の切り替え（トレード成立／FA契約）：親球団・傘下3A・球歴・記録・その年の年度成績の所属表記まで、
   実際に新しい球団へ移す。呼び出し側はこの後に pathYearScreen() → 新聞表示の順で進める
   （mlbMDemoted と同じ「安定画面を先に保存してから新聞を重ねる」方式） */
function applyMlbTrade(newMlb, how){
  var oldMlb = mlbOrgName();
  var finYear = (P._yearEnd && P._yearEnd.mlbM) ? P._yearEnd.mlbM.finYear : null;
  var org = mlbOrgByMlbName(newMlb);
  P.mlbOrg = newMlb;
  if(org) P._mlbAaa = org.aaa;
  P.pathOrg = newMlb;
  P.pathYear = 1;
  P._yearEnd = null;
  P._mlbBad = 0;
  P._lastTradeAge = P.age;
  P.path.push({label:(how==='fa' ? 'FA移籍：' : how==='waiver' ? 'ウェイバー移籍：' : 'トレード移籍：')+newMlb});
  pushCareerStage(stageObj(newMlb, 'MLB', {text: how==='demand' ? 'トレード志願が実り、移籍が成立した' : how==='fa' ? 'FAで契約し、移籍した' : how==='waiver' ? 'ウェイバーで獲得され、移籍した' : 'トレードで移籍した'}));
  recPush((how==='fa' ? 'FA移籍：' : how==='waiver' ? 'ウェイバー移籍：' : 'トレード移籍：')+oldMlb+' → '+newMlb, P.eval);
  /* その年の年度成績の所属表記も移籍先に切り替える（シーズン中の移籍として扱う） */
  if(finYear != null && P.seasonStats){
    for(var i=P.seasonStats.length-1; i>=0; i--){
      if(seasonStageOf(P.seasonStats[i])==='mlbM'){ P.seasonStats[i].label = orgLabel('mlbM', newMlb)+finYear+'年目'; break; }
    }
  }
}
/* 降格の岐路：「トレードを志願する」。成立すれば別球団でメジャー継続、実らなければ3A降格 */
function mlbDemoteTrade(){
  var ye = P._yearEnd; var perf = (ye && ye.mlbM) ? ye.mlbM.perf : 50;
  if(Math.random() < mlbMoveOdds('trade', perf)){
    var to = pickOtherMlbOrg();
    applyMlbTrade(to, 'demand');
    pathYearScreen();
    showPaperNews({name:'スポーツ日報', edition:'朝刊・スポーツ面', photo:'【写真】新天地のユニフォームに袖を通す'+esc(P.name)},
      esc(P.name)+'のトレード志願実る、'+esc(to)+'へ',
      '降格通告から一転、メジャーで再び勝負へ',
      '3A降格を通告されていた'+esc(P.name)+'が球団にトレードを志願し、'+esc(to)+'への移籍が成立した。相手球団は「まだメジャーで戦える選手だ」と獲得の理由を語る。降格ではなく移籍という形で、メジャーの舞台に残ることになった。',
      '');
  } else {

/* DFAの岐路：「海外／米独立で現役を続ける」。年齢制限は設けない（36歳以上でNPB復帰が

/* トレードの岐路：本人の反応（0=新天地で勝負／1=残留を訴える／2=ベテランらしく手本宣言）。

function mlbTradeReact(kind){

      esc(P.name)+'の'+esc(to)+'へのトレードが成立した。本人は「新しい場所でもやることは同じ。若い選手の手本になれるよう戦う」とコメントし、潔い姿勢が現地メディアでも好意的に報じられている。新天地での期待は小さくない。',
      '');

  applyMlbTrade(to, 'trade');
  pathYearScreen();
  showPaperNews({name:'スポーツ日報', edition:'朝刊・スポーツ面', photo:'【写真】新天地のユニフォームに袖を通す'+esc(P.name)},

    '');

/* MLBからNPB復帰へ：逆輸入としてドラフト会議に臨む。戦力外からの帰国は新聞で報じる */
function mlbMToNPB(released){
  /* 年齢上限の保険：NPB復帰（逆輸入ドラフト）は35歳まで。36歳以上は構造的に進めない */
  if(P.age>35){
    setView(playerStatusCard()
      + '<div class="card"><p class="lead">NPB復帰（逆輸入ドラフト）に懸けられるのは35歳までだ。'+P.age+'歳の今、ドラフト会議で指名される現実味はない。アメリカで戦い続けるか、ここで区切りをつけるか――残された道は二つだ。</p></div>'
      + '<button class="choice" onclick="mlbMDemoted()"><b>マイナー契約でアメリカに残る</b><span>傘下3Aから出直し、再びメジャー昇格を目指す。</span></button>'
      + '<button class="choice" onclick="mlbRetireEnding(\'retire\')"><b>アメリカで現役を終える（引退）</b><span>メジャーで戦った日々に区切りをつける。エピローグへ。</span></button>');
    saveProgress('player', 'playerPathYearEnd');
    return;
  }
  P.reverseImport = true; P._fromMlbM = true; P._yearEnd = null;
  if(released===2){
    recPush('降格通告を受け、退団してNPB復帰に懸けることを決めた', P.eval);
    showNews(esc(P.name)+'、退団し帰国 ― NPB復帰を目指す',
      '降格通告を受け入れず、逆輸入に懸ける',
      '3A降格を通告された'+esc(P.name)+'が、'+esc(mlbOrgName())+'を退団し、帰国してNPB復帰を目指すことを決めた。「マイナーで燻るくらいなら、日本で勝負したい」。メジャーで戦った実績は、「逆輸入」としてドラフト会議の評価に乗る。どの球団が指名するのか、会議当日に注目が集まる。',
      '',
      function(){ runPlayerDraftDay('MLB（逆輸入候補）'); });
    return;
  }
  if(released){
    showNews(esc(P.name)+'、帰国しNPB復帰を目指す',
      '戦力外から、逆輸入に懸ける',
      esc(mlbOrgName())+'から戦力外通告を受けた'+esc(P.name)+'が、帰国してNPB復帰を目指すことを決めた。メジャーで戦った実績は、「逆輸入」としてドラフト会議の評価に乗る。海の向こうで揉まれた選手を、どの球団が指名するのか。会議当日に注目が集まる。',
      '',
      function(){ runPlayerDraftDay('MLB（逆輸入候補）'); });
    return;
  }
  runPlayerDraftDay('MLB（逆輸入候補）');
}
/* シーズン記録がどの舞台のものか（stage が無い旧セーブは行ラベルから推定する） */
function seasonStageOf(a){
  if(a.stage) return a.stage;
  var lb = a.label || '';
  if(lb.indexOf('メジャーリーグ')>=0) return 'mlbM';
  if(lb.indexOf('MLBマイナー')>=0) return 'mlb';
  return '';
}
/* MLBでキャリアを終えた場合のエピローグ：実際に記録されたマイナー／MLBの年度成績から集計する */
function mlbRetireEnding(reason){
  var minor = [], major = [];
  (P.seasonStats||[]).forEach(function(a){ var st = seasonStageOf(a); if(st==='mlb') minor.push(a); else if(st==='mlbM') major.push(a); });
  function agg(list){
    var t = {g:0, outs:0, w:0, l:0, er:0, so:0, ab:0, h:0, hr:0, rbi:0, sb:0};
    list.forEach(function(a){ ['g','outs','w','l','er','so','ab','h','hr','rbi','sb'].forEach(function(k){ t[k] += (a[k]||0); }); });
    return t;
  }
  var mn = agg(minor), mj = agg(major);
  var isP = P.pos==='投手';
  function eraTxt(t){ return t.outs>0 ? (t.er*9/(t.outs/3)).toFixed(2) : '―'; }
  function line(t){
    if(isP) return t.g+'試合 '+t.w+'勝'+t.l+'敗 防御率'+eraTxt(t)+' 奪三振'+t.so;
    return t.g+'試合 打率'+(t.ab>0 ? avgStr(t.h/t.ab) : '―')+' '+t.hr+'本塁打 '+t.rbi+'打点 '+t.sb+'盗塁';
  }
  var perfSum = 0; major.forEach(function(a){ perfSum += mlbPerfScore(a); });
  var perfAvg = major.length ? perfSum/major.length : 0;
  var rank = (major.length>=5 && perfAvg>=55) ? 'S' : major.length>=4 ? 'A' : major.length>=2 ? 'B' : major.length>=1 ? 'C' : 'D';
  /* 引退勧告を受け入れてセレモニーで締めた場合は、花道で終えたキャリアとして評価を1段引き上げる */
  if(reason==='ceremony'){ var _ro = 'DCBAS'; var _ri = _ro.indexOf(rank); if(_ri>=0 && _ri<4) rank = _ro[_ri+1]; }
  var titleMap = {}; (P.mlbTitles||[]).forEach(function(t){ titleMap[t] = (titleMap[t]||0)+1; });
  var titles = titleListFromMap(titleMap);
  var hasMajor = major.length>=1;
  var endLabel = major.length>=4 ? 'メジャーに定着した挑戦' : major.length>=2 ? 'メジャーと3Aを行き来した日々' : major.length>=1 ? 'メジャーの舞台に立った挑戦' : 'メジャー未到達のまま戦い抜いたアメリカ挑戦';
  if(reason==='ceremony') endLabel = hasMajor ? '引退セレモニーで花道を飾ったキャリア' : '3Aで引退セレモニーを受け、花道を飾ったアメリカ挑戦';
  var orgName = mlbOrgName();
  P.path.push({label: reason==='ceremony' ? (hasMajor ? '引退勧告を受け入れ、MLBで引退セレモニーの花道で現役を終えた（'+P.age+'歳）' : '引退勧告を受け入れ、3Aで引退セレモニーの花道で現役を終えた（'+P.age+'歳）') : (hasMajor ? 'MLBで現役を終えた（'+P.age+'歳）' : 'アメリカで現役を終えた（'+P.age+'歳）')});
  var archSummary = hasMajor ? 'MLB'+major.length+'年／'+(isP ? '通算 '+mj.w+'勝'+mj.l+'敗・防御率'+eraTxt(mj) : '通算 打率'+(mj.ab>0?avgStr(mj.h/mj.ab):'―')+'・'+mj.hr+'本塁打')+'／マイナー'+minor.length+'年'
    : 'マイナー'+minor.length+'年／'+(isP ? '通算 '+mn.w+'勝'+mn.l+'敗・防御率'+eraTxt(mn) : '通算 打率'+(mn.ab>0?avgStr(mn.h/mn.ab):'―')+'・'+mn.hr+'本塁打');
  if(titles.length) archSummary += '／'+titles[0];
  if(reason==='ceremony') archSummary += hasMajor ? '／引退セレモニーで現役を終えた' : '／3Aで引退セレモニーを受け現役を終えた';
  saveArchive({date:new Date().toLocaleDateString('ja-JP'), mode:'選手編', title:P.name+(reason==='ceremony' ? (hasMajor ? ' MLBで引退セレモニーを受け現役引退' : ' アメリカ挑戦 3Aで引退セレモニーを受け現役引退') : (hasMajor ? ' MLBで現役引退' : ' アメリカで現役引退')), rank:rank, career:archSummary, journey:playerCareerChainText()});
  var reasonText = reason==='age' ? '44歳。体力の限界を迎え、アメリカでの現役生活に区切りをつけた。'
    : reason==='ceremony' ? (hasMajor ? '球団からの勧告を受け入れ、用意された引退セレモニー（引退試合）で花道を飾り、アメリカでの現役生活に区切りをつけた。' : '球団からの勧告を受け入れ、3Aで用意された引退セレモニー（引退試合）で花道を飾り、アメリカでの現役生活に区切りをつけた。')
    : reason==='released' ? '戦力外通告を受け、アメリカで現役を終える決断をした。'
    : reason==='npb' ? 'NPB復帰を懸けたドラフトでは指名がなく、アメリカでの挑戦に区切りをつけた。'
    : '自らの決断で、アメリカでの現役生活に区切りをつけた。';
  var finalLead = hasMajor ? 'メジャーのグラウンドに立った日本人選手は、歴史の中でもほんの一握りだ。'+esc(P.name)+'はその一人として、'+major.length+'シーズンを戦った。海を渡り、夢の舞台で戦った事実は消えない。'
    : 'メジャーのグラウンドに立つ夢には、ついに届かなかった。それでも'+esc(P.name)+'はマイナーで'+minor.length+'シーズンを戦い抜いた。長距離移動と厳しい競争の中で生き残り続けた年月こそ、このアメリカ挑戦の証だ。海を渡り、最後まで挑み続けた事実は消えない。';
  var shareText = hasMajor ? '『運命のドラフト会議』選手編｜'+P.name+'（'+P.pos+'）はMLBで'+major.length+'年プレーし'+(reason==='ceremony' ? '引退セレモニーを受けて' : '')+'現役を引退。ランク'+rank+'。'+archSummary+' #運命のドラフト会議'
    : '『運命のドラフト会議』選手編｜'+P.name+'（'+P.pos+'）はアメリカ挑戦でマイナー'+minor.length+'年プレーし'+(reason==='ceremony' ? '、3Aで引退セレモニーを受けて' : '')+'現役を引退。ランク'+rank+'。'+archSummary+' #運命のドラフト会議';
  setView('<div class="paper"><div class="kicker">選手編・エンディング</div><div class="title-big" style="font-size:25px;">'+(hasMajor ? 'メジャーの舞台を去る' : 'アメリカの舞台を去る')+'</div>'
    + '<p class="lead">'+reasonText+'マイナーで'+minor.length+'年、メジャーで'+major.length+'年。海の向こうで戦い抜いた日々が、'+esc(P.name)+'の球歴に刻まれた。</p>'
    + '<div class="rankbig">'+rank+'</div><p class="center small">'+(hasMajor ? 'MLB挑戦ランク（メジャー定着度と成績で判定）' : 'アメリカ挑戦ランク（マイナーでの在籍年数と成績で判定）')+'</p>'
    + summaryPlayer(hasMajor ? 'MLB（'+esc(orgName)+'）で現役を終えた。' : 'アメリカ（'+esc(orgName)+'傘下3A）で現役を終えた。')
    + '<div class="card"><h3 style="margin:2px 0 8px;">エピローグ ― アメリカでの軌跡</h3>'
    + '<div class="stat-grid">'
    + '<div class="stat"><div class="lb">MLB在籍</div><div class="vl" style="font-size:17px;">'+major.length+'年</div></div>'
    + '<div class="stat"><div class="lb">マイナー在籍</div><div class="vl" style="font-size:17px;">'+minor.length+'年</div></div>'
    + '<div class="stat"><div class="lb">メジャーデビュー</div><div class="vl" style="font-size:17px;">'+(P.mlbDebutAge ? P.mlbDebutAge+'歳' : '―')+'</div></div>'
    + '<div class="stat"><div class="lb">引退年齢</div><div class="vl" style="font-size:17px;">'+P.age+'歳</div></div>'
    + '</div>'
    + (hasMajor ? '<p style="margin:6px 0;"><b>MLB通算成績</b><br>'+esc(line(mj))+'</p>' : '')
    + '<p style="margin:6px 0;"><b>マイナー通算成績</b><br>'+esc(line(mn))+'</p>'
    + (titles.length ? '<p style="margin:6px 0;"><b>獲得タイトル</b><br>'+titles.map(function(t){ return '<span class="tag gold">'+esc(t)+'</span>'; }).join('')+'</p>' : '')
    + '<p style="margin:6px 0;"><b>キャリアの終わり</b>：'+esc(endLabel)+'</p>'
    + (reason==='ceremony' ? '<p style="margin:6px 0;"><b>引退セレモニー</b>：'+(hasMajor ? '最終戦では引退試合が組まれ、スタンドからは惜しみない拍手が送られた。' : '最終戦は3Aの本拠地で引退試合が組まれ、スタンドからは惜しみない拍手が送られた。メジャー未到達のまま長年戦い続けたベテランへ、地元ファンから温かいコールが送られた。')+'チームメイトに胴上げされ、花束を受け取る姿が現地メディアでも大きく報じられた。球団からの勧告を受け入れて花道で終える――戦力外ではなく「送られる側」で終えたことも、このキャリアの評価に静かに効いている。</p>' : '')
    + '<p class="lead" style="margin:6px 0;">'+finalLead+'</p></div>'
    + '</div>'
    + shareBlock(shareText)
    + '<button class="btn sub" onclick="showTitle()">タイトルに戻る</button>');
}

   アメリカ（マイナー／メジャー）と海外の年度成績を、実際に記録された分だけ集計して締める */

/* ============ 選手編：進路の岐路の報道（指名漏れ→別進路／転進で海外・MLBマイナー） ============
   既存の新聞（指名時・下剋上など）と重なる場面では出さない。指名漏れの進路決定はスポーツ紙、
   MLBマイナー契約は一面級（ドラフト日報）で報じる */
/* 指名漏れのあとに選んだ進路の記事（進路先ごとに文面を変える）。mlb は一面級、それ以外はスポーツ紙 */
function buildRouteNews(type, org){
  var nm = esc(P.name), orgT = esc(orgLabel(type, org));
  if(type==='mlb'){
    var par = mlbParentOf(org);
    return {head: nm+'、'+(par ? esc(par) : 'MLB球団')+'とマイナー契約',
      sub: '傘下3A・'+esc(org)+'からメジャー昇格を目指す',
      body: 'ドラフト会議で指名がなかった'+nm+'が、MLBの'+(par ? esc(par) : '球団')+'とマイナー契約を結んだ。所属は傘下3Aの'+esc(org)+'（'+esc(minorLeagueText(org))+'）。メジャー昇格は結果と枠次第の狭き門だが、3Aで数字を残し続ければ昇格の声はかかる。海を渡る決断に、球界関係者からも注目が集まっている。',
      side: 'マイナー契約は毎年が見直し。昇格への階段は、ここから始まる。'};
  }
  var paper = {name:'スポーツ日報', edition:'朝刊・スポーツ面', photo:'【写真】新たな舞台への決意を語る'+nm};
  if(type==='uni') return {paper:paper, head:'指名漏れの'+nm+'、'+esc(org)+'へ進学', sub:'4年後のドラフトへ、大学で力を付ける', body:'今秋のドラフト会議で指名がなかった'+nm+'が、'+orgT+'への進学を決めた。「呼ばれる側になるには、まだ力が足りなかった」。大学野球の4年間で土台を作り直し、卒業年のドラフトで再び懸ける。無名のまま終わるか、4年後に名前を呼ばれるかは、これからの日々が決める。', side:''};
  if(type==='company') return {paper:paper, head:nm+'、社会人野球へ', sub:orgT+'で、働きながら再挑戦', body:'今秋のドラフト会議で指名がなかった'+nm+'が、社会人野球の'+orgT+'への入部を決めた。働きながら高いレベルでプレーし、毎年のドラフトに懸ける道だ。都市対抗の舞台で結果を残せば、スカウトの評価は一気に変わる。', side:''};
  if(type==='ind') return {paper:paper, head:nm+'、独立リーグと契約', sub:orgT+'で「見つけてもらう」挑戦', body:'今秋のドラフト会議で指名がなかった'+nm+'が、独立リーグの'+orgT+'と契約した。薄給でも、毎試合がスカウトへの査定の場になる。「まずは数字を残すこと。それだけを考える」。這い上がりの物語は、ここから始まる。', side:''};
  if(type==='overseas') return {paper:paper, head:nm+'、海外挑戦を決断', sub:orgT+'と契約――「逆輸入」を目指す', body:'今秋のドラフト会議で指名がなかった'+nm+'が、海外リーグの'+orgT+'と契約した。異国で結果を残せば、「逆輸入」として翌年以降のドラフトで評価が跳ね上がる例は少なくない。言葉も環境も違う地での挑戦が始まる。', side:''};

  var hardEnd = false;

     26歳の強制ドラフト等の対象にはしない。NPB復帰（逆輸入ドラフト）に懸けられるのは
     35歳までで、44歳のシーズンを終えたら現役の終わりになる（海外ルートの既存の仕組み＋44歳上限） */
  if(P.curPath==='overseas' && P._proOverseas){

  var trait = PATH_TRAITS[P.curPath] || {growthMin:1, growthMax:3, evalMul:0.7};

  P._yearEnd = {fromPath:fromPath, fromLabel:fromLabel, eligible:eligible, optionalDraft:optionalDraft, forcedReason:forcedReason, graduation:graduation, growth:growth, evalGain:evalGain, msg:msg, msg2:msg2, hardEnd:hardEnd};

/* ============ ライバル球団の志向（プレイヤーの行動と完全に独立） ============
   各球団はシーズン開始時点で「補強ポイント（最優先／次点／手厚い＝補強優先度が低い）」と
   「区分の好み」「実力の見立ての癖（世間評価と真の実力のどちらに寄せるか）」を持つ。
   これらは開始時に一度だけ決まり、プレイヤーの視察・訪問には一切反応しない。
   ライバルの指名は、この補強ポイント×各球団なりの選手評価でのみ決まる */
function initRivalState(){
  S.noise = teamNoiseMap(S.pool);
  /* ライバル各球団の見立てのブレは自軍のノイズより広く取る（中位以下の選手ほど球団ごとに評価が割れる） */
  S.spread = {};
  S.pool.forEach(function(c){
    S.spread[c.id] = {};
    TEAMS.forEach(function(t,ti){ S.spread[c.id][ti] = ri(-12,12); });
  });
  S.needs = {}; S.rivalProfile = {};
  TEAMS.forEach(function(t,ti){
    var order = shuffle(['投手','捕手','内野手','外野手']);
    S.needs[ti] = [order[0], order[1]];
    var catBonus = {};
    ['hs','uni','company','ind','overseas','odd'].forEach(function(k){ catBonus[k] = ri(-8,8); });
    S.rivalProfile[ti] = {
      primary: order[0], secondary: order[1], surplus: order[3],
      catBonus: catBonus,
      potSense: rf(0.10,0.40) /* 世間評価からどれだけ「実力の見立て」側へ寄せるか（球団のスカウト網の癖） */
    };
  });
  /* 逆輸入と異色経歴はニッチな層：本気で追っている球団がいるのは各カテゴリ7割程度の年だけ、
     しかもその球団の狙いは「特定の1人」に絞られている（例：大嶋匠を獲った日本ハム）。
     その他の球団は原則として手を出さないため、プレイヤーの狙いと競合するのは例外的なケースに限られる */
  var rivalIdx = TEAMS.map(function(t,ti){ return ti; }).filter(function(ti){ return ti!==S.team; });
  S.nicheHunter = {}; S.nicheTarget = {};
  ['overseas','odd'].forEach(function(cat){
    if(Math.random()<0.7){
      S.nicheHunter[cat] = pick(rivalIdx);
      var tops = S.pool.filter(function(c){ return c.cat===cat; }).sort(function(a,b){ return b.media-a.media; }).slice(0,3);
      if(tops.length) S.nicheTarget[cat] = pick(tops).id;
    }
  });
}
/* ライバル球団 ti にとっての選手 c の価値。参照するのは選手自身の属性（世間評価・実力・ポジション・区分）と
   球団の補強ポイント／自軍がすでに獲った顔ぶれだけ。プレイヤーの視察回数・訪問は一切見ない */
function rivalValue(c, ti){
  var prof = S.rivalProfile && S.rivalProfile[ti];
  if(!prof) return teamValue(c, ti, S.noise);
  var sp = (S.spread && S.spread[c.id]) ? S.spread[c.id][ti] : 0;
  var deepRound = (typeof D!=='undefined' && D && D.phase==='shihai' && D.round>=3);
  if(c.media<88) sp = Math.round(sp * (deepRound ? 2.2 : 1.6)); /* 世代級の大物は各球団の評価が一致しやすいが、中位以下は見立てが大きく割れ、巡目が深いほど各球団の色が出る */
  var est = c.media + sp + (c.pot - c.media) * prof.potSense;
  var needAdj;
  if(c.pos===prof.primary) needAdj = 15;
  else if(c.pos===prof.secondary) needAdj = 5;
  else if(c.pos===prof.surplus) needAdj = -14;
  else needAdj = -5;
  if(c.media>=93) needAdj = Math.round(needAdj*0.7); /* 世代級の大物は需要のズレを少しだけ押し切る */
  var fillAdj = 0;
  if(typeof D!=='undefined' && D && D.results && D.results[ti]){
    var n = 0;
    D.results[ti].forEach(function(p){ if(p.type==='shihai' && p.cand.pos===c.pos) n++; });
    fillAdj = -n * (c.pos==='投手' ? 4 : 9); /* 補強ポイントが埋まるほど、そのポジションへの執着は薄れる */
  }
  var v = est + needAdj + (prof.catBonus[c.cat]||0) + fillAdj;
  if(c.cat==='overseas' || c.cat==='odd'){
    /* 逆輸入・異色経歴はニッチな層。本気の1球団が狙う特定の1人だけは競合し得るが、それ以外は原則として手を出さない */
    var hunter = S.nicheHunter && S.nicheHunter[c.cat];
    if(ti===hunter && S.nicheTarget && S.nicheTarget[c.cat]===c.id) v -= 12;
    else v -= 30;
  }
  return v;
}
