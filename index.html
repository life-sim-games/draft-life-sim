function scoutAction(cat){
  if(S.actions<=0) return;
  S.actions--;
  var targets = S.pool.filter(function(c){ return c.cat===cat && c.takenBy<0; });
  var msgs = [];
  targets.forEach(function(c){
    c.scouted++;
    c.unc = Math.max(3, c.unc - ri(5,8));
    c.estMid = clamp(Math.round(c.estMid + (c.pot - c.estMid)*rf(0.25,0.5)), 20, 99);
  });
  var spot = SCOUT_SPOTS.filter(function(s){return s.cat===cat;})[0];
  msgs.push(spot.label+' ― '+CAT_LABEL[cat]+'候補'+targets.length+'人の評価精度が上がった。');
  /* コメント付与 */
  var withC = shuffle(targets).slice(0,3);
  withC.forEach(function(c){
    if(!c.comment){
      var cm = c.pot>=80 ? pick(['「今年の目玉の一人。下位では残っていない」','「球団の将来を背負える素材」','「即戦力に近い完成度」'])
        : c.pot>=65 ? pick(['「堅実に育つタイプ。指名順位とのバランスが鍵」','「欠点は少ない。伸びしろをどう見るか」','「他球団もリストに入れている気配」'])
        : c.pot>=50 ? pick(['「素材は平凡だが、化ける要素はある」','「下位で獲れれば面白い」','「評価が割れている選手」'])
        : pick(['「現時点では指名圏外に近い」','「来年以降の素材」','「賭けの要素が強い」']);
      c.comment = cm;
    }
  });
  if(withC.length) msgs.push('注目：'+withC.map(function(c){return esc(c.name)+'（'+esc(candOrg(c))+'）';}).join('、')+'のレポートを更新。');
  /* ランダムイベント */
  var ev = Math.random();
  if(ev<0.16 && targets.length){
    var c1 = pick(targets); c1.mediaEvent = (c1.mediaEvent||0) - 6; refreshMedia(c1);
    msgs.push('<span class="hl">怪我の情報：</span>'+esc(c1.name)+'が故障を抱えているとの情報。世間の評価が下がった。');
  } else if(ev<0.44){
    var tw = S.pool.filter(function(c){return c.twoWay && c.takenBy<0;});
    if(tw.length){ tw[0].scouted++; msgs.push('<span class="hl">二刀流の逸材：</span>'+esc(tw[0].name)+'（'+esc(candOrg(tw[0]))+'）が投打両方で結果を残しているという報告が入った。'); }
  } else if(ev<0.56 && targets.length){
    var c3 = pick(targets); c3.estMid = clamp(c3.estMid+5,20,99); c3.unc = Math.max(3,c3.unc-3);
    msgs.push('<span class="hl">大化けの兆し：</span>'+esc(c3.name)+'が最近急成長している。自軍の評価を上方修正した。');
  }
  msgs.forEach(function(m){ S.log.push(SCOUT_MONTHS[S.monthIdx]+'：'+m); });
  scoutMonth();
}

/* ============ 訪問：意向確認（段階開示）と関係づくり ============
   訪問1回目で意向の大まかな方向性、2回目で条件の詳細まで分かる。
   通うほど関係（信頼）が深まり、入団合意率が少し上がる。
   ライバル球団の志向はプレイヤーの訪問・視察とは完全に独立に決まるため、ここでは一切影響させない */
function intentHintText(c){
  if(!c.intent) return 'プロ志望の意思は本気の様子（特別な条件はなさそうだ）';
  if(c.intent.type==='rank') return '上位での指名を希望している様子（何位までが条件かは、まだ掴めていない）';
  if(c.intent.type==='study') return '進学と迷っている様子';
  if(c.intent.type==='mlb') return 'MLBへの憧れが強い様子';
  if(c.intent.type==='local') return '特定の球団への入団を強く希望している様子';
  return '';
}
function relationText(c){
  var v = c.visitCount||0;
  if(v<=0) return 'まだ接点なし';
  if(v===1) return '顔見知り程度';
  if(v===2) return '良好（本音を話してくれる関係）';
  return '深い信頼関係';
}
function visitCandidate(cid){

/* 育成候補の「原石」度：世間評価より実力の伸びしろが大きい若手、身体能力型、異色経歴が育成の入口に合う */
function ikuseiGemBonus(c){
  var b = 0;
  if(c.pot - c.media >= 10) b += 10;
  if(c.age<=20) b += 4;
  if(c.cat==='odd') b += 8;
  if(c.profile){
    if(c.pos==='投手' && c.profile.velo>=147) b += 5;
    if(c.pos!=='投手' && (parseFloat(c.profile.run)<=6.0 || c.profile.throwDist>=105)) b += 5;
  }
  return b;
}
function isIkuseiGem(c){ return ikuseiGemBonus(c) >= 10; }
function aiBestFor(ti, minV){
  var best=null, bv=-1;
  S.pool.forEach(function(c){
    if(c.takenBy>=0) return;
    /* ライバル球団は「補強ポイント×独自の見立て」で評価する。自軍の自動指名（他スカウト担当分）には適用しない */
    var v = (ti!==S.team) ? rivalValue(c, ti) : teamValue(c, ti, S.noise);
    if(typeof D!=='undefined' && D && D.phase==='ikusei') v += ikuseiGemBonus(c); /* 育成は原石を獲りにいく */
    if(v>bv){bv=v;best=c;}
  });
  return (best && bv>=minV) ? best : null;
}
function recordPick(ti, c, round, type, note, auto){
  c.takenBy = ti;
  D.results[ti].push({cand:c, round:round, type:type, auto:!!auto, hazure:!!(note && note.indexOf('外れ1位')>=0)});
  if(auto && !D.autoNoteShown){ D.autoNoteShown = true; D.feed.push('―― ここからの指名は他のスカウト担当が進めます ――'); }
  if(ti===S.team){ if(type==='shihai') D.userShihai++; else D.userIkusei++; }
  var label = type==='ikusei' ? '育成'+round+'巡目' : round+'巡目';
  var shock = pickShockText(c, round, type);
  D.feed.push(label+'｜'+TEAMS[ti].short+' ― '+c.name+'（'+c.pos+'・'+CAT_LABEL[c.cat]+'）｜'+candOrg(c)+(note?' '+note:'')+(shock ? ' <b>'+shock+'</b>' : '')+(auto?' 【他スカウト担当】':''));
  /* 意外な指名はスポーツ紙の特集候補に（1回の会議で最大3件。残りはフィード注記のみ） */
  var sk = surpriseKindOf(c, round, type);
  if(sk && D.featureQueue && (D.featureShown + D.featureQueue.length) < 3){
    D.featureQueue.push({cand:c, team:ti, round:round, type:type, kind:sk});
  } else if((c.cat==='overseas' || c.cat==='odd') && D.miniNews){
    /* 一面級の特集にならなかった逆輸入・異色の指名は、順位によらず日報の小欄記事にする */
    D.miniNews.push({cand:c, team:ti, round:round, type:type});
  }
}

function draftPick(cid){
  var c = S.pool.filter(function(x){return x.id===cid;})[0];
  if(D.pickFor==='r1'){ resolveRound1(cid); return; }
  if(D.pickFor==='hazure'){ recordPick(S.team, c, 1, 'shihai', '【外れ1位】'); D.round=2; D.turnIdx=0; advanceDraft(); return; }
  if(D.pickFor==='shihai'){ recordPick(S.team, c, D.round, 'shihai'); D.turnIdx++; advanceDraft(); return; }
  if(D.pickFor==='ikusei'){ recordPick(S.team, c, D.ikuseiRound, 'ikusei'); D.turnIdx++; advanceIkusei(); return; }
}
function resolveRound1(userCid){
  var userCand = S.pool.filter(function(x){return x.id===userCid;})[0];
  var noms = {}; /* candId -> [teamIdx...] （自軍除く） */
  WAIVER.forEach(function(ti){
    if(ti===S.team) return;
    var b = aiBestFor(ti, 0);
    if(b){ if(!noms[b.id]) noms[b.id]=[]; noms[b.id].push(ti); }
  });
  var hazureQueue = [];
  /* 自軍の指名と無関係な競合・単独を解決 */
  Object.keys(noms).forEach(function(cid){
    if(parseInt(cid,10)===userCid) return;
    var group = noms[cid];
    var c = S.pool.filter(function(x){return x.id==cid;})[0];
    if(c.takenBy>=0) { group.forEach(function(ti){ hazureQueue.push(ti); }); return; }
    if(group.length===1){ recordPick(group[0], c, 1, 'shihai'); }
    else {
      var w = pick(group);
      recordPick(w, c, 1, 'shihai', '【'+group.length+'球団競合・抽選】');
      group.forEach(function(ti){ if(ti!==w) hazureQueue.push(ti); });
    }
  });
  var rivals = noms[userCid] || [];
  if(rivals.length===0){
    recordPick(S.team, userCand, 1, 'shihai');
    finishHazure(hazureQueue, false);
  } else {
    D.pendingLottery = {cand:userCand, teams:[S.team].concat(rivals)};
    D.hazureQueue = hazureQueue;
    renderLottery();
  }
}
function renderLottery(){

    + '<div class="paper center"><p class="lead">あなたの指名した <b>'+esc(L.cand.name)+'</b>（'+esc(candOrg(L.cand))+'）に、<b>'+L.teams.map(function(ti){return TEAMS[ti].short;}).join('・')+'</b> の'+L.teams.length+'球団が競合した。</p>'

function finishHazure(queue, userNeedsPick){
  queue.sort(function(a,b){ return WAIVER.indexOf(a)-WAIVER.indexOf(b); });
  queue.forEach(function(ti){

function advanceDraft(){
  while(true){
    if(D.round>7){ startIkusei(); return; }
    if(D.turnIdx>=WAIVER.length){ D.round++; D.turnIdx=0; continue; }
    var ti = WAIVER[D.turnIdx];
    if(ti===S.team){
      if(D.userShihai>=7){ D.turnIdx++; continue; }
      if(shouldAutoPick('shihai')){
        if(D.userShihai < D.aiTarget[S.team]){ var ab = aiBestFor(S.team, 42); if(ab) recordPick(S.team, ab, D.round, 'shihai', '', true); }
        D.turnIdx++; continue;
      }
      D.pickFor='shihai'; renderDraftPickScreen(); return;
    }
    if(D.results[ti].filter(function(p){return p.type==='shihai';}).length < D.aiTarget[ti]){
      var b = aiBestFor(ti, 42);

function endUserShihai(){

  while(D.round<=7){
    if(D.turnIdx>=WAIVER.length){ D.round++; D.turnIdx=0; continue; }
    var ti = WAIVER[D.turnIdx];
    if(ti!==S.team && D.results[ti].filter(function(p){return p.type==='shihai';}).length < D.aiTarget[ti]){
      var b = aiBestFor(ti, 42);

function startIkusei(){

function advanceIkusei(){
  while(true){
    if(D.ikuseiRound>2){ negotiationPhase(); return; }
    if(D.turnIdx>=WAIVER.length){ D.ikuseiRound++; D.turnIdx=0; continue; }
    var ti = WAIVER[D.turnIdx];
    if(ti===S.team){
      if(D.userIkusei>=2){ D.turnIdx++; continue; }
      if(shouldAutoPick('ikusei')){
        if(D.userIkusei < (D.aiIkuseiTarget[S.team]||0)){ var ib = aiBestFor(S.team, 30); if(ib) recordPick(S.team, ib, D.ikuseiRound, 'ikusei', '', true); }
        D.turnIdx++; continue;
      }

function passIkusei(){ D.userIkusei = Math.max(D.userIkusei, 0); D.aiIkuseiTarget[S.team] = D.userIkusei; D.turnIdx = WAIVER.length; advanceIkusei(); }
/* ============ 入団交渉 ============ */
/* 入団合意率：本人の意向（隠し）と指名内容の一致が軸。原則として、指名されればほとんどの選手は入団する。
   拒否が現実味を持つのは「意向を把握していたのに、条件をはっきり外す指名をしたとき」が中心で、
   把握していなかった場合は本人の多くがまず入団を選ぶ。訪問で築いた関係（信頼）が深いほど合意率は少し上がる */
function joinProbability(c, round, type){
  var base;
  if(!c.intent) base = 1;
  else if(c.intent.type==='rank'){
    if(type==='ikusei') base = 0.5;
    else if(round<=c.intent.n) base = 1;
    else if(round===c.intent.n+1) base = 0.82;
    else base = 0.65;
  }
  else if(c.intent.type==='study') base = round<=2 ? 0.95 : (round<=4 ? 0.8 : 0.6);
  else if(c.intent.type==='mlb'){
    /* MLB志望でも、上位で獲られれば大半はNPB入団を選ぶ。拒否は不釣り合いな下位・育成で獲ったときだけ */
    if(type==='ikusei') base = 0.35;

  }

    /* 意向を把握していない指名では、拒否率はさらに下がる（気配だけ掴んでいる場合はその中間） */
    base = c.intentHint ? 1-(1-base)*0.6 : 1-(1-base)*0.4;

  if(base<1 && trust>0) base = Math.min(0.97, base + trust*0.05);
  return base;
}
/* 入団拒否の理由は、本人の意向と矛盾しない形で出す */
function refusalReason(c, round, type){

  if(c.intent.type==='mlb') return 'MLB挑戦の意思が固く、渡米を選んだ。';

/* プロ通算成績の詳細生成：要約1行（proLine）とサマリーの成績表は、必ずこの同じ totals から作る */
function pitchTotalsFor(score){
  var era = score>=83? rf(2.4,3.3) : score>=72? rf(3.1,3.9) : score>=60? rf(3.8,4.6) : rf(4.4,5.6);
  var w = score>=83? ri(45,110) : score>=72? ri(20,55) : score>=60? ri(6,22) : score>=47? ri(0,6) : 0;
  var g = score>=92? ri(118,148) : score>=83? ri(100,138) : score>=72? ri(74,118) : score>=60? ri(45,95) : score>=47? ri(8,30) : ri(0,8);
  w = Math.min(w, Math.max(0, Math.round(g*0.72))); /* 勝利数が登板数を超えないためのクランプ */
  var ipPer = score>=72? rf(5.3,6.3) : score>=60? rf(2.2,4.2) : rf(1.0,1.8);
  var outs = Math.round(g*ipPer*3);
  var k9 = score>=83? rf(7.8,9.6) : score>=72? rf(7.0,8.6) : score>=60? rf(6.2,7.8) : rf(5.0,7.0);
  var relief = score>=60 && score<83;
  return {g:g, w:w, l:clamp(w + ri(-6,10), 0, Math.max(0, g - w)), era:Math.round(era*100)/100, outs:outs,
    so:Math.round(outs/3*k9/9), sv:(relief && Math.random()<0.4 ? ri(3,26) : ri(0,2)), hd:(relief ? ri(2,28) : ri(0,6))};
}
function batTotalsFor(score, tags){
  var avgB = score>=83? rf(0.272,0.305) : score>=72? rf(0.255,0.285) : score>=60? rf(0.235,0.262) : score>=47? rf(0.200,0.240) : rf(0.150,0.210);
  var hr = score>=92? ri(120,260) : score>=83? ri(60,150) : score>=72? ri(25,70) : score>=60? ri(5,28) : score>=47? ri(0,6) : 0;
  var g = score>=92? ri(680,840) : score>=83? ri(560,760) : score>=72? ri(420,640) : score>=60? ri(220,460) : score>=47? ri(40,160) : ri(0,30);
  var ab = score>=60? Math.round(g*rf(3.2,3.9)) : Math.round(g*rf(1.2,2.6));
  var h = Math.round(ab*avgB);
  if(hr>h) hr = h; /* 本塁打が安打を超えないための安全クランプ */
  var fast = tags && tags.indexOf('俊足')>=0;
  return {g:g, ab:ab, h:h, avg:(ab>0? h/ab : avgB), hr:hr,
    rbi:Math.round(hr*rf(1.9,2.6) + g*rf(0.16,0.32)), sb:Math.round(g*(fast? rf(0.10,0.24) : rf(0.005,0.05)))};
}
function proTotalsFor(c, score){
  var t = {};
  var bs = clamp(score-10, 5, 100); /* 二刀流の「もう一方」は一段下の帯で生成（従来の答え合わせと同じ） */
  if(c.pos==='投手'){ t.pitch = pitchTotalsFor(score); if(isTwoWayC(c)) t.bat = batTotalsFor(bs, c.tags); }
  else { t.bat = batTotalsFor(score, c.tags); if(isTwoWayC(c)) t.pitch = pitchTotalsFor(bs); }
  return t;
}
/* 獲得タイトル：結果スコア（＝6年後の実績）を軸に判定する。指名順位には直接依存させないため、
   下位・育成から大成した選手にもタイトルが付き、上位指名でも伸び悩めば付かない */
function proTitlesFor(c, score, totals){
  var titles = [];
  function add(t){ if(titles.indexOf(t)<0 && titles.length<4) titles.push(t); }
  var bs = isTwoWayC(c) ? clamp(score-10, 5, 100) : null;
  if((bs!=null? Math.max(score,bs) : score)>=72 && Math.random()<0.18) add('新人王');
  function pitchTitles(s, tot){
    if(!tot || tot.g===0) return;
    if(s>=92){ var pool=['最多勝','最優秀防御率','最多奪三振','ベストナイン']; shuffle(pool).slice(0, ri(1,3)).forEach(add); if(Math.random()<0.25) add('沢村賞'); if(Math.random()<0.16) add('MVP'); }
    else if(s>=83){ if(Math.random()<0.18) add('最多勝'); if(Math.random()<0.18) add('最優秀防御率'); if(Math.random()<0.18) add('最多奪三振'); if(Math.random()<0.30) add('ベストナイン'); if(Math.random()<0.20) add('ゴールデングラブ賞'); }
    else if(s>=72){ if(Math.random()<0.12) add('ベストナイン'); if(Math.random()<0.12) add('ゴールデングラブ賞'); }
    else if(s>=60){ if(Math.random()<0.08 && (tot.sv>=5 || tot.hd>=10)) add('最優秀中継ぎ投手'); if(Math.random()<0.05) add('ゴールデングラブ賞'); }
  }
  function batTitles(s, tot){
    if(!tot || tot.g===0) return;
    var fast = c.tags && c.tags.indexOf('俊足')>=0;
    if(s>=92){ var pool=['首位打者','最多安打','ベストナイン']; if(tot.hr>=120){ pool.push('最多本塁打'); pool.push('打点王'); } if(fast) pool.push('盗塁王'); shuffle(pool).slice(0, ri(1,3)).forEach(add); if(Math.random()<0.16) add('MVP'); }
    else if(s>=83){ if(Math.random()<0.15) add('首位打者'); if(Math.random()<0.18) add('最多安打'); if(tot.hr>=90 && Math.random()<0.12) add('最多本塁打'); if(Math.random()<0.12) add('打点王'); if(fast && Math.random()<0.15) add('盗塁王'); if(Math.random()<0.30) add('ベストナイン'); if(Math.random()<0.22) add('ゴールデングラブ賞'); }
    else if(s>=72){ if(Math.random()<0.12) add('ベストナイン'); if(Math.random()<0.12) add('ゴールデングラブ賞'); }
    else if(s>=60){ if(Math.random()<0.05) add('ゴールデングラブ賞'); }
  }
  if(c.pos==='投手'){ pitchTitles(score, totals.pitch); if(totals.bat) batTitles(bs, totals.bat); }
  else { batTitles(score, totals.bat); if(totals.pitch) pitchTitles(bs, totals.pitch); }
  return titles;
}

/* 指名時の評価コメント：候補者詳細（detailComment）と同じ材料（自軍コメント＋視察で判明した傾向＋見極め結論）から、

function outcomeOf(c, ti, round, type){

  var injury = Math.random()<0.12; /* 故障というキャリア要因：スコアにも理由付けにも反映する */
  var score = Math.round(c.pot*0.75 + ri(0,32) + (c.age<=20?3:0) - (c.age>=27?4:0) + oppBonus - (injury? ri(8,15):0));
  score = clamp(score, 5, 108);
  var tier;
  if(score>=92) tier='球界のスター（タイトル獲得）';
  else if(score>=83) tier='一軍の主力';

  else if(score>=47) tier='二軍止まり';

  /* 通算成績の詳細と獲得タイトルを先に確定させ、要約1行（proLine）は同じ totals から作る（二刀流は投打両方） */
  var totals = proTotalsFor(c, score);
  var titles = proTitlesFor(c, score, totals);
  var proLine;
  if(c.pos==='投手'){ proLine = 'プロ通算 '+totals.pitch.w+'勝｜防御率 '+totals.pitch.era.toFixed(2); if(totals.bat) proLine += '｜打者として 打率 '+avgStr(totals.bat.avg)+'・'+totals.bat.hr+'本塁打'; }
  else { proLine = 'プロ通算 打率 '+avgStr(totals.bat.avg)+'｜'+totals.bat.hr+'本塁打'; if(totals.pitch) proLine += '｜投手として '+totals.pitch.w+'勝・防御率 '+totals.pitch.era.toFixed(2); }
  /* 理由付け：上で実際に効かせた要因（実力・指名順位・球団の出場機会・故障）から作る */
  var reason;
  if(score>=83){
    if(round>=4 || type==='ikusei') reason = '下位指名ながら、与えられたチャンスを掴んで離さなかった';
    else if(oppBonus>=2) reason = '実力が高く、入団した球団で同ポジションに空きがあった';
    else reason = '実力の高さに加え、首脳陣の起用がはまった';
    if(injury) reason += '（故障離脱の時期もあったが、復帰後に巻き返した）';
  } else if(score>=72){
    reason = oppBonus>=2 ? '実力に加え、出場機会に恵まれたことが大きかった' : '一軍の厚い層の中でも、自分の役割を掴んだ';
    if(injury) reason += '（故障で離脱した時期があった）';
  } else if(score>=60){
    reason = injury ? '故障で離脱した時期があり、出場機会が安定しなかった' : '出場機会は限られたが、与えられた場面では結果を残した';
  } else if(score>=47){
    if(injury) reason = '故障で離脱が長く、復帰後も本来の力を取り戻せなかった';
    else if(oppBonus<=-2) reason = '一軍の同ポジションにレギュラーがいて、出場機会が得られなかった';
    else reason = c.pos==='投手' ? '球威はあったが、制球の安定が最後まで課題だった' : 'プロの変化球への対応が壁になり、打席を重ねられなかった';
  } else {
    if(injury) reason = '故障で離脱が長く、一軍の舞台に立つ前にキャリアが止まった';
    else if(oppBonus<=-2) reason = '同ポジションの層が厚く、二軍でも出場機会が限られた';
    else reason = c.pos==='投手' ? 'プロの打者相手に決め球が通用せず、二軍の壁を越えられなかった' : 'プロの球への対応が追いつかず、二軍の壁を越えられなかった';
  }

     同じ結果から作る（別々に生成すると年度や移籍先が矛盾するため） */
  var hr = Math.random();

  var history = '';

  }
  return {score:score, tier:tier, proLine:proLine, reason:reason, history:history, chain:chain, chainText:chain.join(' → '), totals:totals, titles:titles};
}
/* 引退後の第二の人生（歩みチェーンの締めに使う一言） */
var SECOND_LIFE = ['引退後は球団職員として球界に残った','引退後は地元で少年野球の指導者になった','引退後は母校の臨時コーチを務めている','引退後は会社員として第二の人生を歩んでいる','引退後は野球用品メーカーに就職した','引退後は高校野球の指導者を目指して勉強中'];
/* 入団後の歩みチェーン：outcomeOf の結果（スコア＝結果ティア、故障、出場機会、移籍イベント）だけから組み立てる。
   年度別成績や通算成績と別の結果を捏造しないこと。6年後の答え合わせ時点までの歩みを描く */
function buildCareerChain(c, ti, round, type, score, injury, oppBonus, move){
  var steps = [];
  var isP = c.pos==='投手';
  var others = TEAMS.map(function(t,i){ return i; }).filter(function(i){ return i!==ti; });
  steps.push(TEAMS[ti].short+'（'+(type==='ikusei' ? '育成'+round+'位' : round+'位')+'）入団');
  /* 年次整合：年を持つステップは、直前の年次ステップ以上になるよう順にクランプする（lastYear） */
  var lastYear = 0;
  /* 育成指名の場合は支配下昇格が最初の分岐。昇格可否はスコア（＝ティア）と一致させる */
  var promoted = true;
  if(type==='ikusei'){
    var promoYear = 0;
    if(score>=72) promoYear = score>=83 ? 1 : 2;
    else if(score>=60) promoYear = ri(2,3);
    else if(score>=47){ promoted = Math.random()<0.5; promoYear = ri(3,4); }
    else promoted = false;
    if(promoted){ steps.push('プロ'+promoYear+'年目に支配下登録（育成から昇格）'); lastYear = promoYear; }
    else steps.push('二軍でアピールを続けたが、支配下登録には届かず');
  }
  /* 定着度合い：結果ティアと一致させる */
  if(score>=92){
    var sy = Math.max(lastYear, round<=2 ? 1 : ri(1,2));
    steps.push('プロ'+sy+'年目に一軍定着'+(sy===1 ? 'し、新人王級のインパクトを残した' : ''));
    steps.push(isTwoWayC(c) ? '投打両面でタイトル級の活躍を見せた' : (isP ? 'エース級の活躍でタイトルを獲得' : '中軸としてタイトルを獲得'));
    lastYear = sy;
  } else if(score>=83){
    var d1 = Math.max(lastYear, ri(1,2)), s1 = Math.max(d1, Math.min(3, d1+ri(0,1)));
    steps.push('プロ'+d1+'年目に一軍デビュー');
    steps.push(s1>d1 ? 'プロ'+s1+'年目に一軍定着し、主力に成長' : 'そのまま一軍に定着し、主力に成長');
    lastYear = s1;
  } else if(score>=72){
    var d2 = Math.max(lastYear, ri(1,3)), s2 = Math.max(d2, Math.min(4, d2+ri(0,1)));
    steps.push('プロ'+d2+'年目に一軍デビュー');
    steps.push(s2>d2 ? 'プロ'+s2+'年目に一軍定着' : 'そのまま一軍に定着');
    lastYear = s2;
  } else if(score>=60){
    var d3 = Math.max(lastYear, ri(1,3));
    steps.push('プロ'+d3+'年目に一軍デビュー');
    steps.push('一軍と二軍を行き来する一軍半の立場が続いた');
    lastYear = d3;
  } else if(score>=47){
    if(type==='ikusei' && !promoted){ /* 「支配下に届かず」を入団直後に入れたので追加しない */ }
    else if(type==='ikusei') steps.push('支配下登録は果たしたが、一軍定着には届かず二軍暮らしが続いた');
    else steps.push(score>=53 ? '一軍出場はわずかで、二軍暮らしが続いた' : '一軍出場はなく、二軍暮らしが続いた');
  } else {
    if(type==='ikusei' && !promoted){ /* 同上 */ }
    else steps.push(score>=35 ? '一軍出場は数試合のみで、二軍暮らしが続いた' : '一軍の舞台には立てず、二軍暮らしが続いた');
  }
  /* 故障：理由付けに使った要因をチェーンにも刻む */
  if(injury){
    steps.push(score>=72 ? '故障で長期離脱の時期もあったが、復帰後に巻き返した' : '故障で長期離脱し、復帰後も本来の力を取り戻せなかった');
  }
  /* 移籍イベント：履歴文と同じイベントを使う */
  var released = false;
  if(move){
    /* 移籍年はデビュー・定着年以上にクランプする（move.year自体を書き換え、履歴文とも一致させる） */
    move.year = Math.max(move.year, lastYear); lastYear = move.year;
    if(move.kind==='trade') steps.push('プロ'+move.year+'年目に'+TEAMS[move.to].short+'へトレード（出場機会と球団の補強方針）');
    else if(move.kind==='gendora') steps.push('プロ'+move.year+'年目に現役ドラフトで'+TEAMS[move.to].short+'へ移籍（出場機会を求めて）');
    else if(move.kind==='overseas'){ steps.push('プロ'+move.year+'年目に海外挑戦（'+move.league+'）'); steps.push('その後NPBに復帰'); }
    else if(move.kind==='resign'){ steps.push('プロ'+move.year+'年目に戦力外'); steps.push('トライアウトを経て'+TEAMS[move.to].short+'と契約し、現役続行'); released = true; }
  }
  /* 締め：一軍に届いた選手は6年時点でも現役。届かなかった選手は戦力外後の行き先へ分岐する */
  if(score>=60){
    var endTeam = (move && move.kind!=='overseas') ? TEAMS[move.to].short+'で' : '';
    if(score>=92) steps.push(endTeam+'球団の顔として現役継続中');
    else if(score>=83) steps.push(endTeam+'一軍の主力として現役継続中');
    else if(score>=72) steps.push(endTeam+'一軍定着のまま現役継続中');
    else steps.push(endTeam+'一軍と二軍を行き来しながら現役継続中');
    return steps;
  }
  if(!released){
    var ry = score>=47 ? ri(4,6) : ri(2,4);
    if(type==='ikusei' && !promoted) ry = ri(3,5);
    /* 戦力外年は、移籍年より後（移籍がない場合はデビュー・定着・昇格年以上）にクランプする */
    ry = Math.max(ry, lastYear);
    if(move) ry = Math.max(ry, move.year+1);
    var rWhy = injury ? '故障の影響で成績が戻らず構想外' : (oppBonus<=-2 ? '同ポジションの層が厚く構想外' : (isP ? '成績が伸び悩み構想外' : '打撃が伸び悩み構想外'));
    steps.push('プロ'+ry+'年目に戦力外（'+rWhy+'）');
  } else if(Math.random()<0.55){
    steps.push('新天地でも定着できず戦力外');
  } else {
    steps.push('新天地でも二軍が主戦場のまま現役継続中');
    return steps;
  }
  var br = Math.random();
  if(br<0.30){
    steps.push('トライアウトで'+TEAMS[pick(others)].short+'と育成契約');
    steps.push('支配下に届かず引退');
    if(Math.random()<0.7) steps.push(pick(SECOND_LIFE));
  } else if(br<0.55){
    steps.push(pick(IND_TEAMS)+'へ移籍（独立リーグ）');
    if(Math.random()<0.5) steps.push(score>=47 ? '独立リーグで復活し、現役継続中' : '独立リーグで現役継続中');
    else { steps.push('独立リーグでプレーした後、引退'); if(Math.random()<0.6) steps.push(pick(SECOND_LIFE)); }
  } else if(br<0.72){
    var ovOrg = pickOverseasOrg(); var ovInfo = OVS_INFO[ovOrg];
    steps.push(ovOrg+'へ移籍（'+(ovInfo ? ovInfo.league+'・'+ovInfo.country : '海外リーグ')+'）');
    steps.push('海外で現役継続中');
  } else if(br<0.88){
    steps.push(pick(COMPANIES)+'へ移籍（社会人野球）');
    steps.push('社会人野球で現役継続中');
  } else {
    steps.push('引退');
    steps.push(pick(SECOND_LIFE));
  }
  return steps;
}
function careerSim(){
  /* 答え合わせの結果は一度だけ計算し、新聞文面ごと保持する（復元時に同じ結果・同じ記事を出すため） */
  if(D.careerNews && D.finalResult){
    saveProgress('scout', 'scoutCareerNews');
    showNews(D.careerNews.head, D.careerNews.sub, D.careerNews.body, D.careerNews.side, function(){ scoutEnding(); });
    return;
  }
  var teamTotals = [];
  TEAMS.forEach(function(t, ti){
    var picks = D.results[ti] || [];
    var total = 0, details = [];
    picks.forEach(function(p){
      var o = outcomeOf(p.cand, ti, p.round, p.type);
      var useIt = (ti===S.team) ? D.joined.indexOf(p)>=0 : true;
      if(useIt){ total += p.type==='ikusei' ? Math.round(o.score*0.5) : o.score; }
      details.push({pick:p, outcome:o, joined:useIt});
    });
    teamTotals.push({team:ti, total:total, details:details});
  });
  teamTotals.sort(function(a,b){ return b.total-a.total; });
  var rankPos = 0; teamTotals.forEach(function(tt,i){ if(tt.team===S.team) rankPos = i+1; });
  var myTT = teamTotals.filter(function(tt){return tt.team===S.team;})[0];
  /* 名スカウト度は「自分で指名した1〜5位」の成果を主軸に判定。他スカウト担当（6位以降・育成）の指名・拒否は大きく影響させない */
  var ownDetails = myTT.details.filter(function(d){ return !d.pick.auto; });
  var ownGot = ownDetails.filter(function(d){ return d.joined; }).length;
  var ownOutcomes = [];
  ownDetails.forEach(function(d){ if(d.joined) ownOutcomes.push(d.outcome.score); });
  var ownAvg = ownOutcomes.length ? ownOutcomes.reduce(function(a,b){ return a+b; }, 0)/ownOutcomes.length : 0;
  var ownBonus = ownOutcomes.length ? clamp(Math.round((ownAvg-45)*0.55), 0, 30) : 0;
  var ownRefusals = D.refusals.filter(function(p){ return !p.auto; }).length;
  var points = (12-rankPos)*3 + ownGot*9 + ownBonus - ownRefusals*6;
  var grade = points>=80?'S':points>=63?'A':points>=46?'B':points>=30?'C':'D';
  /* ドラマ判定 */
  var steal = null, flop = null, missedStar = null;
  myTT.details.forEach(function(d){
    if(d.joined && d.outcome.score>=85 && d.pick.round>=3){ if(!steal || d.outcome.score>steal.outcome.score) steal = d; }
    if(d.joined && d.pick.round<=2 && d.outcome.score<52){ if(!flop || d.outcome.score<flop.outcome.score) flop = d; }
  });
  teamTotals.forEach(function(tt){
    if(tt.team===S.team) return;
    tt.details.forEach(function(d){ if(isScoutedCand(d.pick.cand) && d.outcome.score>=85){ if(!missedStar || d.outcome.score>missedStar.outcome.score) missedStar = d; } });
  });
  var dramaScore = {steal: steal? steal.outcome.score-80:0, flop: flop? 55-flop.outcome.score:0, missed: missedStar? missedStar.outcome.score-80:0};
  var kind = 'steal';
  if(dramaScore.flop>=dramaScore[kind]) kind='flop';
  if(dramaScore.missed>=dramaScore[kind]) kind='missed';
  var head, sub, body;
  if(kind==='steal' && steal){
    head = '大当たり指名！ '+TEAMS[S.team].short+'の'+esc(steal.pick.cand.name)+'がスターに';
    sub = steal.pick.round+'位指名が球団の宝になった';
    body = '6年前のドラフトで'+TEAMS[S.team].name+'が'+steal.pick.round+'巡目に指名した'+esc(steal.pick.cand.name)+'が、いまや球界を代表する選手に育った（6年後の評価：'+steal.outcome.tier+'）。当時の評価は決して高くなかった。しかし担当スカウトの目は正しかった。「あの指名が球団を変えた」――編成部門への評価は、今や球団内でも別格だ。';
  } else if(kind==='missed' && missedStar){
    head = 'あの時獲れていれば… '+esc(missedStar.pick.cand.name)+'が大スターに';
    sub = '目を付けていた逸材は'+TEAMS[missedStar.pick.cand.takenBy].short+'の宝物になった';
    body = TEAMS[S.team].name+'のスカウト陣が視察で目を付けていた'+esc(missedStar.pick.cand.name)+'は、ドラフト会議で'+TEAMS[missedStar.pick.cand.takenBy].name+'に先に獲られ、大スターに成長した（'+missedStar.outcome.tier+'）。あの日、自分の担当する順番で指名できていれば――。ドラフトは一瞬の読み違いが6年後に響く。「目を付けていただけに悔しい」――担当スカウトの言葉に、誰も反論できなかった。';
  } else if(kind==='flop' && flop){
    head = '期待の上位指名、伸び悩み…';
    sub = esc(flop.pick.cand.name)+'の6年は苦いものになった';
    body = TEAMS[S.team].name+'が'+flop.pick.round+'巡目で指名した'+esc(flop.pick.cand.name)+'は、6年を経ても芽が出なかった（'+flop.outcome.tier+'）。素材への評価自体は間違っていなかったという声もあるが、結果がすべて。ドラフトの難しさを、球団全体が噛みしめている。';
  } else {
    var best = null;
    myTT.details.forEach(function(d){ if(d.joined && (!best || d.outcome.score>best.outcome.score)) best = d; });
    if(best){
      head = TEAMS[S.team].short+'の指名選手、6年後の答え合わせ';
      sub = '最高の収穫は'+esc(best.pick.cand.name);
      body = '6年前のドラフトを検証する。'+TEAMS[S.team].name+'の指名選手の中で最も育ったのは'+esc(best.pick.cand.name)+'（'+best.pick.round+'位・'+best.outcome.tier+'）だった。球団順位は12球団中'+rankPos+'位。名スカウトへの道は、まだ続く。';
    } else {
      head = TEAMS[S.team].short+'、苦い答え合わせ';
      sub = '入団した選手が残らなかった';
      body = '6年前のドラフトを検証する。'+TEAMS[S.team].name+'は入団拒否なども重なり、収穫の乏しい会議となった。球団順位は12球団中'+rankPos+'位。ドラフトの怖さを痛感する結果となった。';
    }
  }
  D.finalResult = {rankPos:rankPos, grade:grade, ownGot:ownGot, ownCount:ownDetails.length, teamTotals:teamTotals, myTT:myTT};
  D.careerNews = {head:head, sub:sub, body:body, side:'12球団の指名採点：'+TEAMS[S.team].short+'は'+rankPos+'位（1位は'+TEAMS[teamTotals[0].team].short+'）'};
  saveProgress('scout', 'scoutCareerNews');
  showNews(D.careerNews.head, D.careerNews.sub, D.careerNews.body, D.careerNews.side, function(){ scoutEnding(); });
}
function scoutEnding(){
  var R = D.finalResult;
  var myPicksHtml = R.myTT.details.map(function(d){
    var c = d.pick.cand;
    var headHtml = '<div class="nm" style="font-size:14px;">'+esc(c.name)+' <span class="small">（'+(d.pick.type==='ikusei'?'育成':'')+(d.pick.hazure?'外れ':'')+d.pick.round+'位・'+esc(c.pos)+'）</span>'+(d.pick.auto?' <span class="tag gray">他スカウト担当</span>':'')+'</div>';
    if(d.pick.auto){
      /* 他スカウト担当（6位以降・育成）は従来通りの簡易表示 */
      return '<div class="rowitem"><div class="grow">'+headHtml+'<div class="meta">'+(d.joined? '6年後：'+d.outcome.tier+'｜'+d.outcome.proLine : '<b style="color:var(--bad)">入団拒否</b>')+'</div>'
        + (d.joined && d.outcome.reason ? '<div class="meta">要因：'+esc(d.outcome.reason)+'</div>' : '')
        + (d.joined && d.outcome.chainText ? '<div class="meta" style="color:var(--ink);">入団後の歩み：'+esc(d.outcome.chainText)+'</div>' : '')
        + '</div></div>';
    }
    /* 自分の指名（1〜5位）は詳細版：ドラフト時点の情報＋プロ通算成績の詳細＋獲得タイトル＋球歴と入団後の歩みの統合タイムライン */
    var html = '<div class="pickdetail"><div class="grow">'+headHtml
      + draftInfoHtml(c)
      + '<div class="meta" style="margin-top:6px;">'+(d.joined? '6年後：<b>'+esc(d.outcome.tier)+'</b>｜'+esc(d.outcome.proLine) : '<b style="color:var(--bad)">入団拒否</b>')+'</div>';
    if(d.joined){
      if(d.outcome.reason) html += '<div class="meta">要因：'+esc(d.outcome.reason)+'</div>';
      html += proTotalsHtml(c, d.outcome);
      html += '<div class="meta" style="margin-top:4px;">獲得タイトル：'+(d.outcome.titles && d.outcome.titles.length ? d.outcome.titles.map(function(t){ return '<span class="tag gold">'+esc(t)+'</span>'; }).join('') : 'タイトルなし')+'</div>';
      html += '<div class="meta" style="margin:9px 0 1px;color:var(--ink);"><b>球歴と入団後の歩み（タイムライン）</b></div>'
        + timelineHtml(stageTimelineItems(c.stages).concat(d.outcome.chain.map(function(s){ return {head:s, sub:''}; })));
    } else {
      html += '<div class="meta" style="margin:9px 0 1px;color:var(--ink);"><b>球歴（タイムライン）</b></div>'
        + timelineHtml(stageTimelineItems(c.stages));
    }
    html += '</div></div>';
    return html;
  }).join('');
  /* 他球団は主要な指名（1位と、スター級に育った選手）だけ歩みチェーン付きで載せる */
  var othersHtml = '';
  R.teamTotals.forEach(function(tt){
    if(tt.team===S.team) return;
    tt.details.forEach(function(d){
      if(d.pick.type!=='shihai') return;
      if(!(d.pick.round===1 || d.outcome.score>=83)) return;
      othersHtml += '<div class="rowitem"><div class="grow"><div class="nm" style="font-size:13.5px;">'+esc(TEAMS[tt.team].short)+' '+d.pick.round+'位 '+esc(d.pick.cand.name)+' <span class="small">（'+esc(d.pick.cand.pos)+'）</span></div><div class="meta">6年後：'+d.outcome.tier+'｜'+d.outcome.proLine+'</div>'
        + (d.outcome.chainText ? '<div class="meta" style="color:var(--ink);">入団後の歩み：'+esc(d.outcome.chainText)+'</div>' : '')
        + '</div></div>';
    });
  });
  var ownJoinedNames = R.myTT.details.filter(function(d){ return !d.pick.auto && d.joined; })
    .map(function(d){ return esc(d.pick.cand.name)+'（'+(d.pick.hazure?'外れ':'')+d.pick.round+'位）'; });
  var autoJoinedNames = R.myTT.details.filter(function(d){ return d.pick.auto && d.joined; })
    .map(function(d){ return esc(d.pick.cand.name)+'（'+(d.pick.type==='ikusei'?'育成':'')+d.pick.round+'位）'; });
  saveArchive({date:new Date().toLocaleDateString('ja-JP'), mode:'スカウト編', title:TEAMS[S.team].short+'スカウト：1〜5位で'+R.ownGot+'/'+R.ownCount+'人入団、12球団中'+R.rankPos+'位', rank:R.grade});
  setView('<div class="paper"><div class="kicker">スカウト編・エンディング</div>'
    + '<div class="title-big" style="font-size:25px;">'+TEAMS[S.team].name+'<br>12球団中 '+R.rankPos+'位</div>'
    + '<p class="lead">支配下1〜5位で自分が指名した <b>'+R.ownCount+'人中 '+R.ownGot+'人</b> が入団。入団拒否は '+D.refusals.length+'件。6年後の答え合わせを終えて、名スカウト度の判定が出た。</p>'
    + '<div class="rankbig">'+R.grade+'</div><p class="center small">名スカウト度ランク</p>'
    + '<div class="card"><h3 style="margin:2px 0 6px;">記録サマリー</h3>'
    + '<p class="small" style="margin:3px 0;">自分の指名（1〜5位）で入団：'+(ownJoinedNames.length? ownJoinedNames.join('、') : 'なし')+'</p>'
    + '<p class="small" style="margin:3px 0;">他スカウト担当の指名で入団：'+(autoJoinedNames.length? autoJoinedNames.join('、') : 'なし')+'</p>'
    + '<p class="small" style="margin:3px 0;">指名選手と6年後：</p>'+ myPicksHtml
    + '<p class="small" style="margin:3px 0;">12球団採点 1位：'+TEAMS[R.teamTotals[0].team].short+'／最下位：'+TEAMS[R.teamTotals[11].team].short+'</p></div>'
    + (othersHtml ? '<div class="card"><h3 style="margin:2px 0 6px;">他球団の主な指名（1位・スター級）</h3>'+othersHtml+'</div>' : '')
    + '</div>'
    + shareBlock('『運命のドラフト会議』スカウト編｜'+TEAMS[S.team].short+'のスカウトとして担当した1〜5位で'+R.ownGot+'/'+R.ownCount+'人が入団、12球団中'+R.rankPos+'位。名スカウト度ランク'+R.grade+' #運命のドラフト会議')
    + '<button class="btn sub" onclick="showTitle()">タイトルに戻る</button>');
}
/* 初期表示 */
showTitle();
